<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SLATE Books</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: SLATE OS shell (centred chrome, tabs, iOS grouped lists, right-hand sheets); Finance stays light, wider column for money work. */
:root{
  --bg:#FFFFFF; --group:#F2F2F7; --fill:#E8E8EC; --ink:#000000; --muted:#8E8E93; --faint:#C7C7CC;
  --line:rgba(60,60,67,.12); --border:#E5E5EA;
  --early:#007AFF; --ontime:#34C759; --late:#FF9500; --overdue:#FF3B30;
  --in:#3F7F5A; --out:#000000; --inbg:#EAF8EE; --outbg:#F2F2F7;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --r-lg:16px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:rgba(255,255,255,.92)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wide{max-width:1160px}

.chrome{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top-in{display:flex;align-items:center;justify-content:center;gap:12px;padding-block:14px 6px;position:relative}
.logo{height:40px;width:auto;display:block}
.divider{width:1px;height:26px;background:var(--border)}
.product{display:inline-flex;flex-direction:column;line-height:1.15;font-size:14px;font-weight:500;color:var(--muted)}
.product b{color:var(--ink);font-weight:600;font-size:15px;letter-spacing:.04em}
.tagline{font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.02em}
@media (max-width:560px){.tagline{display:none}}
.me{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-35%);display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.me .ava{width:34px;height:34px}
@media (max-width:640px){.me .who-t{display:none}}
.tabs-in{display:flex;justify-content:center;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab .tab-ic{width:15px;height:15px;flex:none;opacity:.85}.tab[aria-current="page"] .tab-ic{opacity:1}
.tab{appearance:none;border:0;background:none;font-size:14px;font-weight:500;color:var(--muted);padding:10px 10px 9px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.badge{background:var(--overdue);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;line-height:17px;font-weight:600}

main{padding-block:24px 110px;display:grid;gap:24px}
main>*{min-width:0}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--border)}
.h1{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:0}
.lead{color:var(--muted);margin:6px 0 0;font-size:14px;max-width:62ch}
.eyebrow,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.eyebrow{text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.r{text-align:right}

.sec{display:grid;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 4px;flex-wrap:wrap}
.sec-h h2{font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:0}
.sec-h .cnt{font-size:12px;color:var(--muted)}
.list{display:grid;background:var(--group);border-radius:var(--r);overflow:hidden}
.list>p{padding:14px 16px;margin:0}

.row{appearance:none;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 16px 12px 12px;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:2px 14px;align-items:center;cursor:pointer;font:inherit;color:inherit}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(0,0,0,.03)}
.row:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.row-main{min-width:0}.row>.row-main:first-child{grid-column:1/3}
.row-title{font-weight:500;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;overflow-wrap:anywhere}
.row-meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 6px;margin-top:2px}
.row-amt{text-align:right;display:grid;gap:2px;justify-items:end}
.row-amt .a{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-amt .b{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.a.in{color:var(--in)} .a.out{color:var(--out)}
.ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;flex:none}
.ico.in{background:var(--inbg);color:var(--in)} .ico.out{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--border)} .ico.tr{background:#fff;color:var(--early);box-shadow:inset 0 0 0 1px var(--border)} .ico.jv{background:#fff;color:var(--muted);box-shadow:inset 0 0 0 1px var(--border)}
.ico.req{background:#fff;color:var(--late);box-shadow:inset 0 0 0 1px var(--border)} .ico.doc{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--border);font-size:11px}
.day-h{font-size:12px;font-weight:600;color:var(--muted);padding:10px 16px 6px;background:var(--group);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}

.pill{--c:var(--muted);display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap;background:#fff;color:var(--ink)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.st-pending{--c:var(--late)} .st-checked{--c:var(--early)} .st-approved{--c:var(--ontime)} .st-returned{--c:var(--overdue)} .st-void{--c:var(--faint)} .st-tally{--c:var(--faint)} .st-paid{--c:var(--ontime)} .st-rejected{--c:var(--overdue)}
.st-unpaid{--c:var(--late)} .st-part{--c:var(--early)} .st-overdue{--c:var(--overdue)} .st-draft{--c:var(--faint)}
.pill.st-returned,.pill.st-overdue,.pill.st-rejected{color:var(--overdue)}
.tag{font-size:11px;font-weight:600;color:var(--muted);background:var(--fill);padding:1px 7px;border-radius:5px;white-space:nowrap}
.tag-ink{background:var(--ink);color:#fff}

.btn{appearance:none;font-size:14px;font-weight:600;border-radius:var(--r);padding:9px 16px;border:0;background:var(--fill);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--ink);color:#fff}
.btn-accent{background:var(--overdue);color:#fff}
.btn-good{background:var(--ontime);color:#fff}
.btn-danger{color:var(--overdue)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.linkish{appearance:none;background:none;border:0;padding:0;color:var(--ink);font-weight:500;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px;font-size:14px}
.back{justify-self:start}

input,select,textarea{font-size:15px;background:var(--group);border:0;border-radius:var(--r);padding:10px 12px;width:100%;min-width:0;appearance:none}
select{background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%238E8E93' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:30px;cursor:pointer}
input[type="checkbox"]{appearance:auto;width:18px;height:18px;padding:0;accent-color:#000;flex:none}
input[type="file"]{padding:8px}
textarea{min-height:68px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:0}
.form input,.form select,.form textarea{background:#fff}
.field{display:grid;gap:6px;min-width:0}
.f-hint{font-size:12.5px;color:var(--muted)}
.amt-in{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;padding:10px 14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar>select,.bar>input{width:auto;flex:1 1 150px}
.chk-l{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}

.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;flex:none;flex-wrap:wrap}
.seg button{border:0;background:none;font-size:13px;font-weight:500;padding:6px 12px;color:var(--ink);cursor:pointer;border-radius:7px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:grid;gap:4px;align-content:start;min-width:0;text-align:left;font:inherit;color:inherit}
button.kpi{cursor:pointer}button.kpi:hover{border-color:var(--faint)}
.kpi .num{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere}
.kpi .lbl{display:flex;align-items:center;gap:6px}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi[data-s] .lbl::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.kpi.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.kpi.dark .lbl,.kpi.dark .s{color:#9a9aa0}
.say{background:var(--group);border-radius:12px;padding:14px 16px;font-size:16px;line-height:1.5}
.say b{font-weight:600}
.widgets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.w{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px 16px;display:grid;gap:12px;align-content:start;min-width:0;grid-template-columns:minmax(0,1fr)}
.w.span2{grid-column:span 2}
@media (max-width:760px){.w.span2{grid-column:auto}}
.w-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.w-t{font-size:14px;font-weight:600}
.w-s{font-size:12px;color:var(--muted)}
.w-empty{font-size:13px;color:var(--muted);padding:8px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.hb-can .nm::after{content:' ▾';color:var(--muted);font-size:11px}button.hb-can.is-open .nm::after{content:' ▴'}
.hb-sub{display:grid;gap:2px;margin:-4px 0 6px;padding:8px 10px;border-radius:10px;background:var(--fill, #f2f2f7)}
.hb-sub-t{font-size:12px;font-weight:600;color:var(--muted);padding:2px 2px 6px}
.hb-sub button{appearance:none;background:none;border:0;border-top:1px solid var(--line, rgba(60,60,67,.12));font:inherit;color:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:7px 2px;font-size:13px}
.hb-sub button:first-of-type{border-top:0}.hb-sub .a{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.hb .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;min-width:64px}
.track{position:relative;height:12px;background:var(--group);border-radius:4px;overflow:hidden}
.track span{display:block;height:100%;background:var(--c,var(--ink));border-radius:4px}
.track.track2{display:flex;gap:2px}.track span.fut{background:#D7263D;opacity:.85}
.hb .v small.v-fut{display:block;font-size:11px;font-weight:600;color:#D7263D;line-height:1.1}
.hbars>.hb{font-size:14px}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .bi{fill:var(--k-in)} .chart .bo{fill:var(--k-out)}
.wl{display:grid}
.wl button{appearance:none;background:none;border:0;border-top:1px solid var(--line);padding:9px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;cursor:pointer;font:inherit;font-size:14px;color:inherit}
.wl button:first-child{border-top:0}
.wl .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl .m .mono{font-size:11.5px}
.pst-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;flex:none}
.pst-a.pst-dot{background:#34A853}.pst-d.pst-dot{background:#2F6FD6}.pst-h.pst-dot{background:#F2A007}.pst-c.pst-dot{background:#AEAEB2}.pst-x.pst-dot{background:#D7262B}
.pst-t{font-weight:600}.pst-t.pst-h{color:#B26A00}.pst-t.pst-c{color:#6E6E73}.pst-t.pst-x{color:#B71C21}
.pst-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pst-chip{display:inline-flex;align-items:center;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:#F2F2F7;color:var(--ink)}
.pst-chip.pst-h{background:#FFF4DE}.pst-chip.pst-x{background:#FDECEC}.pst-chip.pst-c{background:#F2F2F7;color:#6E6E73}
.pst-key{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted);margin-top:2px}
.wl .m{font-size:12px;color:var(--muted);grid-column:1}
.wl .d{grid-row:1/3;grid-column:2;align-self:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.acc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.acc button{appearance:none;border:0;background:var(--group);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;display:grid;gap:2px;font:inherit;color:inherit;min-width:0}
.acc button[aria-pressed="true"]{background:var(--ink);color:#fff}
.acc button[aria-pressed="true"] .s{color:#bbb}
.acc .n{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.acc .s{font-size:11.5px;color:var(--muted)}
.totals{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;padding:0 4px}
.totals b{font-variant-numeric:tabular-nums}

.tbl-wrap{overflow-x:auto;background:var(--group);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .sub2{font-size:12.5px;color:var(--muted)}
tr.g td{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:#fff;padding-top:12px}
tr.t td{font-weight:600;border-top:1px solid var(--faint)}
tr.gt td{font-weight:700;border-top:1px solid var(--ink);border-bottom:3px double var(--ink);background:#fff}
tr.click{cursor:pointer} tr.click:hover td{background:rgba(0,0,0,.03)}
td input,td select{min-width:110px;background:#fff;padding:7px 9px;font-size:14px}

.empty{background:var(--group);border-radius:var(--r-lg);padding:28px 22px;display:grid;gap:10px;justify-items:start}
.empty h3{margin:0;font-size:17px;font-weight:600}
.empty p{margin:0;color:var(--muted)}
.banner{background:var(--group);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.banner.warn{box-shadow:inset 3px 0 0 var(--late)}
.state{padding:60px 0;color:var(--muted);display:grid;gap:6px;text-align:center}
.state strong{color:var(--ink);font-weight:600;font-size:18px}
.card{background:var(--group);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.callout{background:var(--group);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;box-shadow:inset 3px 0 0 var(--late)}
.callout.ok{box-shadow:inset 3px 0 0 var(--ontime)}
.callout.bad{box-shadow:inset 3px 0 0 var(--overdue)}

#sheet{position:fixed;inset:0;z-index:20}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.3)}
.panel{position:absolute;top:0;right:0;bottom:0;width:min(600px,100%);background:#fff;overflow-y:auto;overscroll-behavior:contain;
  padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(36px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  display:grid;gap:16px;align-content:start;grid-auto-rows:max-content;box-shadow:-8px 0 30px rgba(0,0,0,.08)}
.panel.wide{width:min(860px,100%)}
.sh-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sh-title{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.2;overflow-wrap:anywhere}
.icon-btn{appearance:none;border:0;background:var(--group);border-radius:50%;width:32px;height:32px;font-size:18px;line-height:1;cursor:pointer;flex:none;color:var(--muted)}
.sh-status{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sh-status .pill{background:var(--group)}
.big-amt{font-size:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;background:var(--group);border-radius:var(--r);padding:14px 16px}
.facts .v{font-weight:500;font-size:15.5px;overflow-wrap:anywhere;margin-top:2px}
.facts .s{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.form{display:grid;gap:12px;background:var(--group);border-radius:var(--r);padding:16px}
.form-title{font-weight:600}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.err{color:var(--overdue);font-size:13.5px;font-weight:500}
.tl{display:grid;border-left:1px solid var(--border);margin-left:4px}
.tl-item{position:relative;padding:0 0 14px 16px;display:grid;gap:2px;font-size:14px}
.tl-item::before{content:"";position:absolute;left:-4px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--c,var(--faint))}
.tl-item time{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tl-note{font-size:13.5px;color:var(--muted);border-left:2px solid var(--border);padding-left:8px;margin-top:2px;overflow-wrap:anywhere}
.lines{display:grid;gap:8px}
.ln{display:grid;grid-template-columns:minmax(0,2fr) minmax(90px,1fr) minmax(90px,1fr) 34px;gap:8px;align-items:center}
.ln-h{font-size:12px;font-weight:600;color:var(--muted)}
@media (max-width:560px){.ln{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px}.ln>:first-child{grid-column:1/-1}}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.file{appearance:none;border:1px solid var(--border);background:#fff;border-radius:10px;padding:0;overflow:hidden;display:grid;text-align:left;font:inherit;color:inherit;text-decoration:none;min-width:0;position:relative}
.file .th{height:86px;background:var(--group) center/cover no-repeat;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.file .fn{font-size:12px;padding:6px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1;cursor:pointer}
.drop{border:2px dashed var(--faint);border-radius:10px;padding:14px;display:grid;gap:6px;justify-items:start;background:#fff}
.drop.over{border-color:var(--ink)}
.more-i{appearance:none;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;font:inherit;color:inherit;width:100%}
.more-i:last-child{border-bottom:0}
.mi-t{font-weight:600}.mi-d{font-size:13px;color:var(--muted)}.mi-a{font-size:22px;color:var(--faint)}
.ava{width:30px;height:30px;border-radius:50%;background:var(--group);display:inline-grid;place-items:center;font-size:12px;font-weight:600;color:#3a3a3c;flex:none;overflow:hidden}

.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;position:relative;padding-bottom:14px}
.step:last-child{padding-bottom:0}
.step:not(:last-child)::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--border)}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}

<script>
/* SLATE Books — accounting engine. Pure functions, no DOM. */
(function (root) {
  'use strict';

  var GROUPS = [
    { id: 'fa', name: 'Fixed assets at cost', nature: 'A', sec: 'nca', cf: 'inv', cfLabel: 'Fixed assets bought or sold' },
    { id: 'accdep', name: 'Accumulated depreciation', nature: 'A', sec: 'nca', cf: 'op', cfLabel: 'Other operating items' },
    { id: 'recv', name: 'Receivables from clients', nature: 'A', sec: 'ca', cf: 'op', cfLabel: 'Received from clients' },
    { id: 'adv', name: 'Deposits, advances and prepayments', nature: 'A', sec: 'ca', cf: 'op', cfLabel: 'Deposits and advances' },
    { id: 'staffadv', name: 'Advances to staff and partners', nature: 'A', sec: 'ca', cf: 'op', cfLabel: 'Deposits and advances' },
    { id: 'taxa', name: 'Advance tax and VAT credits', nature: 'A', sec: 'ca', cf: 'op', cfLabel: 'Taxes paid and recovered' },
    { id: 'cash', name: 'Cash in hand', nature: 'A', sec: 'cash', cash: true },
    { id: 'bank', name: 'Bank accounts', nature: 'A', sec: 'cash', cash: true },
    { id: 'cap', name: 'Capital accounts', nature: 'E', sec: 'eq', cf: 'fin', cfLabel: 'Capital introduced or withdrawn' },
    { id: 'pl', name: 'Profit and loss closed to capital', nature: 'E', sec: 'eq', cf: 'fin', cfLabel: 'Capital introduced or withdrawn' },
    { id: 'loan', name: 'Loans from related party', nature: 'L', sec: 'ncl', cf: 'fin', cfLabel: 'Loans from related party' },
    { id: 'pay', name: 'Payables to vendors and consultants', nature: 'L', sec: 'cl', cf: 'op', cfLabel: 'Paid to consultants and suppliers' },
    { id: 'stat', name: 'Statutory dues (TDS and VAT)', nature: 'L', sec: 'cl', cf: 'op', cfLabel: 'Taxes paid and recovered' },
    { id: 'accr', name: 'Salary payable and accruals', nature: 'L', sec: 'cl', cf: 'op', cfLabel: 'Paid to staff' },
    { id: 'inc', name: 'Fee income', nature: 'I', sec: 'rev', cf: 'op', cfLabel: 'Received from clients' },
    { id: 'oinc', name: 'Other income', nature: 'I', sec: 'oinc', cf: 'op', cfLabel: 'Interest and other income' },
    { id: 'pc', name: 'Project costs', nature: 'X', sec: 'cos', cf: 'op', cfLabel: 'Paid to consultants and suppliers' },
    { id: 'staff', name: 'Staff costs', nature: 'X', sec: 'opex', cf: 'op', cfLabel: 'Paid to staff' },
    { id: 'occ', name: 'Rent, utilities and office upkeep', nature: 'X', sec: 'opex', cf: 'op', cfLabel: 'Rent, utilities and office upkeep' },
    { id: 'adm', name: 'Administrative expenses', nature: 'X', sec: 'opex', cf: 'op', cfLabel: 'Administrative expenses' },
    { id: 'fin', name: 'Bank and finance charges', nature: 'X', sec: 'opex', cf: 'op', cfLabel: 'Bank charges' },
    { id: 'dep', name: 'Depreciation', nature: 'X', sec: 'opex', cf: 'op', cfLabel: 'Other operating items' }
  ];
  var GROUP = {};
  GROUPS.forEach(function (g) { GROUP[g.id] = g; });
  var TYPES = ['Payment', 'Receipt', 'Contra', 'Journal', 'Sales', 'Purchase'];
  var CF_ORDER = ['Received from clients', 'Interest and other income', 'Paid to staff', 'Paid to consultants and suppliers',
    'Rent, utilities and office upkeep', 'Administrative expenses', 'Bank charges', 'Taxes paid and recovered',
    'Deposits and advances', 'Other operating items', 'Fixed assets bought or sold', 'Capital introduced or withdrawn',
    'Loans from related party'];

  function r2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
  function nz(n) { return Math.abs(n) < 0.005 ? 0 : n; }

  /* ---------- dates and periods ---------- */
  function ym(d) { return d.slice(0, 7); }
  function addMonths(m, k) {
    var y = +m.slice(0, 4), mo = +m.slice(5, 7) - 1 + k;
    y += Math.floor(mo / 12); mo = ((mo % 12) + 12) % 12;
    return y + '-' + String(mo + 1).padStart(2, '0');
  }
  function monthEnd(m) {
    var y = +m.slice(0, 4), mo = +m.slice(5, 7);
    var d = new Date(Date.UTC(y, mo, 0)).getUTCDate();
    return m + '-' + String(d).padStart(2, '0');
  }
  function monthsIn(from, to) {
    var out = [], m = ym(from), end = ym(to);
    while (m <= end && out.length < 600) { out.push(m); m = addMonths(m, 1); }
    return out;
  }
  function dayBefore(d) {
    var t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() - 1);
    return t.toISOString().slice(0, 10);
  }
  function fyStartYear(d, fyStart) {
    var y = +d.slice(0, 4), m = +d.slice(5, 7);
    return m >= fyStart ? y : y - 1;
  }
  /* the financial year a date falls in. rule 'bd': Bangladesh, July–June up to 30 Jun 2027, then FY 2027-28 runs
     1 Jul 2027 to 31 Mar 2028 (nine months), then April–March. Any other rule: a fixed start month (rule or fyStart). */
  function fyOfRule(d, rule, fyStart) {
    if (rule === 'bd' || rule == null || rule === '') {
      if (d < '2027-07-01') return fyRange(fyStartYear(d, 7), 7);
      if (d <= '2028-03-31') return { from: '2027-07-01', to: '2028-03-31', label: 'FY 2027-28', short: '27-28', months: 9 };
      return fyRange(fyStartYear(d, 4), 4);
    }
    var m = +rule || +fyStart || 7;
    return fyRange(fyStartYear(d, m), m);
  }
  function fyRange(startYear, fyStart) {
    var from = startYear + '-' + String(fyStart).padStart(2, '0') + '-01';
    var to = dayBefore((startYear + 1) + '-' + String(fyStart).padStart(2, '0') + '-01');
    return { from: from, to: to, label: 'FY ' + startYear + '-' + String((startYear + 1) % 100).padStart(2, '0'),
      short: String(startYear % 100).padStart(2, '0') + '-' + String((startYear + 1) % 100).padStart(2, '0') };
  }

  /* ---------- prepare ---------- */
  function prepare(state) {
    var ledgers = state.ledgers || {}, vouchersMap = state.vouchers || {};
    var settings = state.settings || {};
    var vouchers = Object.keys(vouchersMap).map(function (id) {
      var v = vouchersMap[id];
      return Object.assign({ id: id }, v);
    }).filter(function (v) { return v && v.date && Array.isArray(v.lines) && v.status !== 'void' && v.status !== 'split'; });
    vouchers.sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      var ai = a.imp || 1e9, bi = b.imp || 1e9;
      if (ai !== bi) return ai - bi;
      var an = a.at || '', bn = b.at || '';
      if (an !== bn) return an < bn ? -1 : 1;
      return a.id < b.id ? -1 : 1;
    });
    var groupOf = {};
    Object.keys(ledgers).forEach(function (k) { groupOf[k] = ledgers[k].group; });
    return { ledgers: ledgers, projects: state.projects || {}, assets: state.assets || {}, vouchers: vouchers,
      settings: settings, groupOf: groupOf };
  }
  function isCashLedger(P, l) { var g = GROUP[P.groupOf[l]]; return !!(g && g.cash); }
  function natureOf(P, l) { var g = GROUP[P.groupOf[l]]; return g ? g.nature : '?'; }
  function vTotal(v) { var t = 0; v.lines.forEach(function (x) { t += +x.dr || 0; }); return r2(t); }
  function vBalanced(v) {
    var d = 0, c = 0; v.lines.forEach(function (x) { d += +x.dr || 0; c += +x.cr || 0; });
    return Math.abs(d - c) < 0.005;
  }

  /* ---------- balances ---------- */
  function balances(P, from, to) {
    var out = {};
    Object.keys(P.ledgers).forEach(function (k) {
      var op = +P.ledgers[k].opening || 0;
      out[k] = { open: op, dr: 0, cr: 0, close: 0 };
    });
    P.vouchers.forEach(function (v) {
      if (to && v.date > to) return;
      var before = from && v.date < from;
      v.lines.forEach(function (x) {
        var b = out[x.l]; if (!b) { b = out[x.l] = { open: 0, dr: 0, cr: 0, close: 0, orphan: true }; }
        var dr = +x.dr || 0, cr = +x.cr || 0;
        if (before) b.open += dr - cr; else { b.dr += dr; b.cr += cr; }
      });
    });
    Object.keys(out).forEach(function (k) {
      var b = out[k];
      b.open = r2(b.open); b.dr = r2(b.dr); b.cr = r2(b.cr); b.close = r2(b.open + b.dr - b.cr);
    });
    return out;
  }

  function trialBalance(P, from, to) {
    var B = balances(P, from, to);
    var groups = GROUPS.map(function (g) {
      var rows = Object.keys(P.ledgers).filter(function (k) { return P.ledgers[k].group === g.id; }).map(function (k) {
        var b = B[k];
        return { id: k, name: P.ledgers[k].name, open: b.open, dr: b.dr, cr: b.cr, close: b.close };
      }).sort(function (a, b) { return a.name.localeCompare(b.name); });
      var t = { open: 0, dr: 0, cr: 0, close: 0 };
      rows.forEach(function (r) { t.open += r.open; t.dr += r.dr; t.cr += r.cr; t.close += r.close; });
      Object.keys(t).forEach(function (k) { t[k] = r2(t[k]); });
      return { group: g, rows: rows, total: t };
    });
    var tot = { openDr: 0, openCr: 0, dr: 0, cr: 0, closeDr: 0, closeCr: 0 };
    groups.forEach(function (G) {
      G.rows.forEach(function (r) {
        if (r.open > 0) tot.openDr += r.open; else tot.openCr -= r.open;
        tot.dr += r.dr; tot.cr += r.cr;
        if (r.close > 0) tot.closeDr += r.close; else tot.closeCr -= r.close;
      });
    });
    Object.keys(tot).forEach(function (k) { tot[k] = r2(tot[k]); });
    tot.diff = r2(tot.closeDr - tot.closeCr);
    return { groups: groups, total: tot };
  }

  /* ---------- income statement ---------- */
  function plMovements(P, from, to) {
    var amt = {};
    P.vouchers.forEach(function (v) {
      if ((from && v.date < from) || (to && v.date > to)) return;
      v.lines.forEach(function (x) {
        var n = natureOf(P, x.l);
        if (n !== 'I' && n !== 'X') return;
        var d = (+x.dr || 0) - (+x.cr || 0);
        amt[x.l] = (amt[x.l] || 0) + (n === 'I' ? -d : d);
      });
    });
    return amt;
  }
  function incomeStatement(P, from, to) {
    var amt = plMovements(P, from, to);
    function grp(id) {
      var rows = Object.keys(P.ledgers).filter(function (k) { return P.ledgers[k].group === id && nz(amt[k] || 0) !== 0; })
        .map(function (k) { return { id: k, name: P.ledgers[k].name, amount: r2(amt[k]) }; })
        .sort(function (a, b) { return b.amount - a.amount; });
      var total = r2(rows.reduce(function (s, r) { return s + r.amount; }, 0));
      return { group: GROUP[id], rows: rows, total: total };
    }
    var rev = grp('inc'), oinc = grp('oinc'), pc = grp('pc');
    var opex = ['staff', 'occ', 'adm', 'fin', 'dep'].map(grp);
    var revenue = rev.total, gross = r2(revenue - pc.total);
    var opexTotal = r2(opex.reduce(function (s, g) { return s + g.total; }, 0));
    var operating = r2(gross - opexTotal);
    var net = r2(operating + oinc.total);
    return { revenue: rev, otherIncome: oinc, projectCosts: pc, opex: opex, totals: { revenue: revenue, gross: gross,
      opex: opexTotal, operating: operating, other: oinc.total, net: net,
      grossPct: revenue ? gross / revenue : null, netPct: revenue ? net / revenue : null } };
  }
  function monthlyPL(P, from, to) {
    var months = monthsIn(from, to);
    var idx = {}; months.forEach(function (m, i) { idx[m] = i; });
    var byGroup = {};
    GROUPS.filter(function (g) { return g.nature === 'I' || g.nature === 'X'; }).forEach(function (g) {
      byGroup[g.id] = months.map(function () { return 0; });
    });
    P.vouchers.forEach(function (v) {
      if (v.date < from || v.date > to) return;
      var i = idx[ym(v.date)];
      v.lines.forEach(function (x) {
        var gid = P.groupOf[x.l], g = GROUP[gid];
        if (!g || (g.nature !== 'I' && g.nature !== 'X')) return;
        var d = (+x.dr || 0) - (+x.cr || 0);
        byGroup[gid][i] += g.nature === 'I' ? -d : d;
      });
    });
    var income = months.map(function (m, i) { return r2(byGroup.inc[i] + byGroup.oinc[i]); });
    var expense = months.map(function (m, i) {
      return r2(['pc', 'staff', 'occ', 'adm', 'fin', 'dep'].reduce(function (s, g) { return s + byGroup[g][i]; }, 0));
    });
    return { months: months, byGroup: byGroup, income: income, expense: expense,
      net: months.map(function (m, i) { return r2(income[i] - expense[i]); }) };
  }

  /* ---------- balance sheet ---------- */
  function balanceSheet(P, asAt) {
    var B = balances(P, null, asAt);
    function grp(id, sign) {
      var rows = Object.keys(P.ledgers).filter(function (k) { return P.ledgers[k].group === id && nz(B[k].close) !== 0; })
        .map(function (k) { return { id: k, name: P.ledgers[k].name, amount: r2(sign * B[k].close) }; })
        .sort(function (a, b) { return Math.abs(b.amount) - Math.abs(a.amount); });
      return { group: GROUP[id], rows: rows, total: r2(rows.reduce(function (s, r) { return s + r.amount; }, 0)) };
    }
    var fa = grp('fa', 1), acc = grp('accdep', 1);
    var current = ['recv', 'adv', 'staffadv', 'taxa', 'cash', 'bank'].map(function (g) { return grp(g, 1); });
    var nca = r2(fa.total + acc.total);
    var ca = r2(current.reduce(function (s, g) { return s + g.total; }, 0));
    var cap = grp('cap', -1), pl = grp('pl', -1);
    var retained = 0;
    Object.keys(P.ledgers).forEach(function (k) {
      var n = natureOf(P, k); if (n === 'I' || n === 'X') retained -= B[k].close;
    });
    retained = r2(retained);
    var equity = r2(cap.total + pl.total + retained);
    var ncl = [grp('loan', -1)], cl = ['pay', 'stat', 'accr'].map(function (g) { return grp(g, -1); });
    var nclT = r2(ncl.reduce(function (s, g) { return s + g.total; }, 0));
    var clT = r2(cl.reduce(function (s, g) { return s + g.total; }, 0));
    var assets = r2(nca + ca), le = r2(equity + nclT + clT);
    var unassigned = 0;
    Object.keys(B).forEach(function (k) { if (!P.ledgers[k]) unassigned += B[k].close; });
    return { asAt: asAt, fixed: fa, accdep: acc, nca: nca, current: current, ca: ca, assets: assets,
      capital: cap, plClosed: pl, retained: retained, equity: equity, ncl: ncl, nclTotal: nclT, cl: cl, clTotal: clT,
      liabEquity: le, diff: r2(assets - le), unassigned: r2(unassigned) };
  }

  /* ---------- cash flow (direct) ---------- */
  function cashFlow(P, from, to) {
    var lines = {}, sec = { op: 0, inv: 0, fin: 0 };
    var B0 = balances(P, from, to);
    var cashIds = Object.keys(P.ledgers).filter(function (k) { return isCashLedger(P, k); });
    var opening = r2(cashIds.reduce(function (s, k) { return s + B0[k].open; }, 0));
    var closing = r2(cashIds.reduce(function (s, k) { return s + B0[k].close; }, 0));
    var unclassified = 0;
    P.vouchers.forEach(function (v) {
      if (v.date < from || v.date > to) return;
      var touches = v.lines.some(function (x) { return isCashLedger(P, x.l); });
      if (!touches) return;
      v.lines.forEach(function (x) {
        if (isCashLedger(P, x.l)) return;
        var g = GROUP[P.groupOf[x.l]];
        var eff = (+x.cr || 0) - (+x.dr || 0);
        if (!g) { unclassified += eff; return; }
        var label = g.cfLabel || 'Other operating items';
        if (!lines[label]) lines[label] = { label: label, sec: g.cf || 'op', in: 0, out: 0 };
        if (eff >= 0) lines[label].in += eff; else lines[label].out -= eff;
        sec[g.cf || 'op'] += eff;
      });
    });
    var rows = CF_ORDER.filter(function (l) { return lines[l]; }).map(function (l) {
      var x = lines[l]; return { label: l, sec: x.sec, in: r2(x.in), out: r2(x.out), net: r2(x.in - x.out) };
    });
    var net = r2(sec.op + sec.inv + sec.fin + unclassified);
    var accounts = cashIds.map(function (k) {
      var b = B0[k];
      return { id: k, name: P.ledgers[k].name, group: P.ledgers[k].group, open: b.open, in: b.dr, out: b.cr, close: b.close };
    });
    return { rows: rows, op: r2(sec.op), inv: r2(sec.inv), fin: r2(sec.fin), unclassified: r2(unclassified), net: net,
      opening: opening, closing: closing, check: r2(opening + net - closing), accounts: accounts };
  }

  /* daily running balance per cash/bank ledger: lowest point and negative days */
  function cashDaily(P, to) {
    var cashIds = Object.keys(P.ledgers).filter(function (k) { return isCashLedger(P, k); });
    var run = {}, low = {}, neg = {};
    cashIds.forEach(function (k) { run[k] = +P.ledgers[k].opening || 0; low[k] = { amount: run[k], date: null }; neg[k] = []; });
    var i = 0, vs = P.vouchers.filter(function (v) { return !to || v.date <= to; });
    while (i < vs.length) {
      var d = vs[i].date;
      while (i < vs.length && vs[i].date === d) {
        vs[i].lines.forEach(function (x) { if (run[x.l] !== undefined) run[x.l] += (+x.dr || 0) - (+x.cr || 0); });
        i++;
      }
      cashIds.forEach(function (k) {
        var b = r2(run[k]);
        if (b < low[k].amount) low[k] = { amount: b, date: d };
        if (b < -0.005) neg[k].push({ date: d, amount: b });
      });
    }
    return { low: low, neg: neg };
  }

  /* ---------- projects ---------- */
  function lineShares(x) {
    var amt = Math.abs((+x.dr || 0) - (+x.cr || 0));
    if (!x.cc || !x.cc.length) return [{ p: null, f: 1 }];
    var s = x.cc.reduce(function (t, c) { return t + (+c.a || 0); }, 0);
    if (s <= 0) return [{ p: x.cc[0].p, f: 1 }];
    var out = x.cc.map(function (c) { return { p: c.p, f: (+c.a || 0) / s }; });
    if (amt && Math.abs(s - amt) > 0.5 && s < amt) out.push({ p: null, f: 1 - s / amt });

/* ---------- vouchers: status and approval ---------- */
const vKind = v => ({ Payment: 'out', Receipt: 'in', Contra: 'tr', Journal: 'jv' }[v.type] || 'jv');
function needs(v) {

/* status a new or edited voucher starts in, given who made it */
function startStatus(v) {

}
const vStatus = v => SB.vStatus(v);
/* the amount approval limits look at: the cash that moved, or the entry total for journals */
function vAmt(v) { const s = vSummary(v); return s.kind === 'in' || s.kind === 'out' ? s.amount : SB.vTotal(v); }
function waitingFor(v) {

}
function trailAdd(arr, act, note) { return (arr || []).concat([Object.assign({ at: new Date().toISOString(), by: S.uid, act, note: note || '' }, stampMe())]); }

/* the voucher's money side for lists: amount, direction, accounts, counterparty */
function vSummary(v) {
  let cash = 0; const accs = [];
  v.lines.forEach(x => { if (isCashL(x.l)) { cash += (+x.dr || 0) - (+x.cr || 0); if (!accs.includes(x.l)) accs.push(x.l); } });
  cash = r2(cash);
  const others = v.lines.filter(x => !isCashL(x.l));
  const kind = !accs.length ? 'jv' : (!others.length || Math.abs(cash) < 0.005 ? 'tr' : (cash > 0 ? 'in' : 'out'));
  const main = others.slice().sort((a, b) => Math.abs((b.dr || 0) - (b.cr || 0)) - Math.abs((a.dr || 0) - (a.cr || 0)))[0];
  const amount = kind === 'in' || kind === 'out' ? Math.abs(cash) : SB.vTotal(v);
  const projs = []; v.lines.forEach(x => (x.cc || []).forEach(c => { if (c.p && !projs.includes(c.p)) projs.push(c.p); }));
  return { kind, amount, accs, main: main ? main.l : (accs[0] || ''), projs, cash };

/* who the money went to (or came from): the non-cash lines on the money side, biggest first, tax lines left out */
/* a consultant whose bill and payment sit in the same entry (Money out with "Paid to" a consultant) */
function passThru(v) { const t = {}; v.lines.forEach(x => { if (groupOf(x.l) === 'pay') { t[x.l] = t[x.l] || [0, 0]; t[x.l][0] += +x.dr || 0; t[x.l][1] += +x.cr || 0; } }); return Object.keys(t).filter(k => t[k][0] > 0 && Math.abs(t[k][0] - t[k][1]) < 0.5); }

}

/* ---------- requests (payment requests, petty cash bills) ---------- */
function allRequests() {
  const out = [];
  for (const [u, items] of Object.entries(S.requests)) for (const [id, r] of Object.entries(items || {})) {
    if (!r || r.withdrawn) continue; out.push(Object.assign({}, r, { id, owner: u, key: u + '~' + id }));
  }
  return out.sort((a, b) => (b.at || '').localeCompare(a.at || ''));
}
function reqStatus(r) {

  if (!d || !d.status) return 'pending';
  if (d.status === 'returned') { const last = (d.trail || []).slice(-1)[0]; if (last && r.at && r.at > last.at) return 'pending'; }
  return d.status;
}

/* what is waiting for me, across vouchers and requests */
function myQueue() {
  const out = [];
  if (!S.admin) return out;
  const r = myRole();
  Object.entries(S.vouchers).forEach(([id, v]) => {
    if (!v || v.status === 'void' || v.status === 'split') return;
    const w = waitingFor(v), amt = vAmt(v);
    if ((w === 'check' && can.check()) || (w === 'approve' && can.approve(amt))) out.push({ kind: 'voucher', id, v: Object.assign({ id }, v), w });
    if (vStatus(v) === 'returned' && v.madeBy === S.uid) out.push({ kind: 'voucher', id, v: Object.assign({ id }, v), w: 'fix' });

  if (can.check()) Object.entries(S.ledgers).forEach(([id, l]) => { if (l && l.pending) out.push({ kind: 'ledger', id, l, w: 'approve' }); });
  allRequests().forEach(q => {

}

/* ---------- invoices ---------- */
function invTotals(inv) {

  const vp = +inv.vatPct || 0;

  const total = inv.vatMode === 'add' ? r2(sub + vat) : sub;
  let received = 0; const pays = [];
  Object.entries(S.vouchers).forEach(([id, v]) => {
    if (!v || v.status === 'void' || v.status === 'split' || v.inv !== inv._id) return;
    const amt = r2(v.lines.filter(x => groupOf(x.l) === 'inc' || x.l === inv.client).reduce((s, x) => s + (+x.cr || 0) - (+x.dr || 0), 0));
    received += amt; pays.push({ id, v, amt });

    wlist(left.slice(0, 6).map(([l, s]) => h('button', { type: 'button', onclick: () => openRecon(l, m) }, h('span', { class: 't', text: L(l) }), h('span', { class: 'm', text: REC_ST[s.st][0] }), h('span', { class: 'd', text: sgn(s.book) })))),
    h('button', { class: 'linkish', type: 'button', style: 'justify-self:start', onclick: () => go('more', 'recon'), text: 'All accounts' })));
}
Object.assign(SHEETS, { recon: sheetRecon });

/* ---------- start-up: capabilities, roles, live data ---------- */
const COLLS = ['ledgers', 'projects', 'assets', 'vouchers', 'invoices', 'files', 'members', 'reqdec', 'cashcounts', 'staff', 'payroll', 'recurring', 'plan', 'jvin', 'recon'];
const NEED = ['settings', 'ledgers', 'vouchers', 'projects'];
let loaded = {}, profTimer = null, catTimer = null, lastProfKey = '';
function changed() { S.ver++; render(); renderSheet(true); scheduleProfiles(); scheduleCatalog(); }
function markLoaded(k) {
  if (loaded[k]) return; loaded[k] = true;
  if (S.state === 'loading' && (S.admin ? NEED.every(n => loaded[n]) : loaded.settings)) { S.state = 'ready'; render(true); }
}
function scheduleProfiles() { clearTimeout(profTimer); profTimer = setTimeout(refreshProfiles, 120); }
async function refreshProfiles() {
  if (!userCap) return;
  const ids = new Set(peopleIds());
  Object.values(S.vouchers).forEach(v => { if (v && v.madeBy) ids.add(v.madeBy); (v && v.trail || []).forEach(e => e.by && ids.add(e.by)); });
  Object.keys(S.requests).forEach(u => ids.add(u));
  Object.values(S.reqdec).forEach(d => (d.trail || []).forEach(e => e.by && ids.add(e.by)));
  Object.values(S.cashcounts).forEach(c => c.by && ids.add(c.by));
  const list = [...ids].filter(Boolean).sort(), key = list.join(',');
  if (!list.length) return;
  try {
    const ps = await userCap.profiles(list);
    const before = JSON.stringify(Object.entries(S.profiles).map(([k, p]) => [k, p.name, p.avatarUrl]));
    S.profiles = ps || {};
    if (key !== lastProfKey || before !== JSON.stringify(Object.entries(S.profiles).map(([k, p]) => [k, p.name, p.avatarUrl]))) { lastProfKey = key; render(); renderSheet(true); }
  } catch (e) { /* names fall back to roles */ }
}
/* the catalog lets office staff pick a category, a project and see the petty cash balance without seeing the books */
function buildCatalog() {
  const cats = Object.keys(S.ledgers).filter(k => ['pc', 'occ', 'adm', 'fin'].includes(groupOf(k)) && activeL(k)).map(k => ({ id: k, name: L(k), group: SB.friendly(P(), k) })).sort((a, b) => a.group.localeCompare(b.group) || a.name.localeCompare(b.name));
  const projects = Object.entries(S.projects).filter(([, p]) => p.status !== 'Closed').map(([id, p]) => ({ id, code: p.code || '', name: p.name })).sort((a, b) => (a.code || a.name).localeCompare(b.code || b.name));
  const pl = pettyLedger(), petty = pl ? { bal: r2((SB.balances(P(), null, today())[pl] || {}).close || 0) } : null;
  return { cats, projects, petty };
}
/* key order is not kept by the store, so compare a sorted form */
function canon(v) { return Array.isArray(v) ? '[' + v.map(canon).join(',') + ']' : v && typeof v === 'object' ? '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}' : JSON.stringify(v === undefined ? null : v); }
function scheduleCatalog() {
  clearTimeout(catTimer);
  if (!S.admin || S.readonly || !can.enter() || S.state !== 'ready' || !loaded.catalog) return;
  catTimer = setTimeout(async () => {
    const next = buildCatalog(), cur = { cats: S.catalog.cats || [], projects: S.catalog.projects || [], petty: S.catalog.petty || null };
    if (canon(next) === canon(cur)) return;
    try { await Store.put('catalog', 'main', Object.assign(next, { at: new Date().toISOString() })); } catch (e) { console.warn('catalog', e); }
  }, 2500);
}
function watchRequests(uid) {
  if (!uid) return;
  Store.watchColl(`requests/${uid}/items`, docs => { S.requests = Object.assign({}, S.requests, { [uid]: docs }); changed(); });
}
async function boot() {
  render(true);
  if (!window.claude || typeof window.claude.use !== 'function') { S.state = 'nohost'; render(true); return; }
  const use = n => window.claude.use(n).catch(() => null);
  const [db, user, assets, downloads] = await Promise.all([use('db'), use('user'), use('assets'), use('downloads')]);
  if (!db) { S.state = 'nohost'; render(true); return; }
  Store.db = db; userCap = user; assetsCap = assets; downloadsCap = downloads;
  const me = user ? await user.me() : null;
  S.me = me; S.uid = me && me.id; S.isOwner = !!(me && me.isOwner); S.admin = !!(me && me.canEdit) || S.isOwner;
  const dw = user ? await user.can('data.write') : null;
  S.readonly = S.admin ? dw === false : false;
  /* everyone with access says they were here, so the Principal can give them a role */
  if (S.uid) {
    try { await Store.db.doc('members/' + S.uid).set({ seen: new Date().toISOString() }); }
    catch (e) { if (!S.admin) { S.state = 'noaccess'; render(true); return; } }
  } else if (!S.admin) { S.state = 'noaccess'; render(true); return; }
  Store.watchDoc('settings/main', d => {
    S.settings = d || {}; setGrouping(S.settings.grouping); changed(); markLoaded('settings');
    if (S.isOwner && S.uid && S.settings.ownerId !== S.uid && !S.readonly && !S.ownerWritten) { S.ownerWritten = true; Store.patch('settings', 'main', { ownerId: S.uid }).catch(() => {}); }
  });
  Store.watchDoc('catalog/main', d => { S.catalog = d || {}; changed(); markLoaded('catalog'); });
  if (S.admin) {
    COLLS.forEach(c => Store.watchColl(c, docs => {
      S[c] = docs; changed(); markLoaded(c);
      if (c === 'members') Object.keys(docs).forEach(watchRequests);
    }));
    Object.keys((S.settings && S.settings.team) || {}).forEach(watchRequests);
    watchRequests(S.uid);
  } else {
    Store.watchColl('reqdec', docs => { S.reqdec = docs; changed(); });
    watchRequests(S.uid);
  }
  setTimeout(() => { if (S.state === 'loading') { S.state = 'ready'; render(true); } }, 9000);
}
if (window.BooksHost) BooksHost.onChange(() => { render(); renderSheet(true); });
boot();

})();
</script>
