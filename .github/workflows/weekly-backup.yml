# SLATE OS · weekly database backup
# Every Thursday night (Dhaka time) the whole SLATE OS database is copied, encrypted with the
# studio's backup passphrase and kept for 90 days under this repository's Actions tab.
# Needs two repository secrets (Settings › Secrets and variables › Actions):
#   SUPABASE_DB_PASSWORD  the database password (Supabase › Project Settings › Database), on its own
#   BACKUP_PASSPHRASE     a long passphrase, kept by the Principal and the COO; without it a backup can't be opened
# The rest of the connection (session pooler, Mumbai) is not secret and is set below.
# Run it any time from Actions › Weekly database backup › Run workflow.
name: Weekly database backup

on:
  schedule:
    - cron: '23 17 * * 4'   # Thursday 17:23 UTC = 23:23 in Dhaka
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PGPORT: '5432'
      PGUSER: postgres.fbktoepdfegtkazbytel
      PGDATABASE: postgres
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets are set
        run: |
          missing=0
          [ -n "$PGPASSWORD" ]        || { echo "::error::Add the SUPABASE_DB_PASSWORD repository secret."; missing=1; }
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "::error::Add the BACKUP_PASSPHRASE repository secret."; missing=1; }
          exit $missing

      - name: Install the PostgreSQL 17 tools (same version as the database)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Copy and encrypt the database
        run: |
          set -euo pipefail
          PG=/usr/lib/postgresql/17/bin
          STAMP=$(TZ=Asia/Dhaka date +%Y-%m-%d)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          mkdir out

          # Report any failure as a short annotation (the connection string never appears in it)
          report() { tr '\n' ' ' < "$1" | sed -E 's#postgres(ql)?://[^ ]*#<connection string>#g; s#password=[^ ]*#password=<hidden>#g' | cut -c1-400; }

          # Find the project's session pooler (Supabase uses either address in Mumbai) and check the password
          : > tried.txt
          for h in aws-1-ap-south-1.pooler.supabase.com aws-0-ap-south-1.pooler.supabase.com; do
            if PGHOST=$h $PG/psql -tAc 'select 1' > /dev/null 2> err.txt; then export PGHOST=$h; break; fi
            echo "[$h] $(report err.txt)" >> tried.txt
          done
          if [ -z "${PGHOST:-}" ]; then
            echo "::error title=Couldn't connect to the database::$(report tried.txt)"; exit 1
          fi
          echo "Connected through $PGHOST"

          # All SLATE OS data: projects, tasks, meetings, Finance, logs, settings
          if ! $PG/pg_dump --format=custom --no-owner --no-privileges \
            --schema=public --file=out/slate-os-data-$STAMP.dump 2> err.txt; then
            echo "::error title=Data copy failed::$(report err.txt)"; exit 1
          fi

          # Sign-in accounts. Best effort: the data copy above is what matters most.
          $PG/pg_dump --format=custom --no-owner --no-privileges \
            --schema=auth --file=out/slate-os-logins-$STAMP.dump \
            || echo "::warning::Sign-in accounts weren't copied this week; the data copy is complete."

          for f in out/*.dump; do
            printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --quiet --pinentry-mode loopback \
              --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$f.gpg" "$f"
            rm "$f"
          done
          ls -lh out
          echo "### SLATE OS backup $STAMP" >> "$GITHUB_STEP_SUMMARY"
          ls -lh out | tail -n +2 | awk '{print "- " $9 " (" $5 ")"}' >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the encrypted backup for 90 days
        uses: actions/upload-artifact@v5
        with:
          name: slate-os-backup-${{ env.STAMP }}
          path: out/*.gpg
          retention-days: 90
          if-no-files-found: error
