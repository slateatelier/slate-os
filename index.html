<!doctype html><html><head><meta charset=utf8><meta name="robots" content="noindex"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#d7262b"><link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SLATE OS"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>@media (max-width:820px){input,select,textarea{font-size:16px!important}}</style><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SLATE OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one centred 720px column of iOS-style grouped lists on white, matching the SLATE FAR Calculator */
:root{
  --bg:#FFFFFF; --group:#F2F2F7; --fill:#E8E8EC; --ink:#000000; --muted:#8E8E93; --faint:#C7C7CC;
  --line:rgba(60,60,67,.12); --border:#E5E5EA;
  --early:#007AFF; --ontime:#34C759; --late:#FF9500; --overdue:#FF3B30;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --r-lg:16px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:rgba(255,255,255,.92)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.chrome{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top-in{display:flex;align-items:center;justify-content:center;gap:12px;padding-block:14px 6px}
.logo{height:40px;width:auto;display:block}
.divider{width:1px;height:26px;background:var(--border)}
.product{font-size:14px;font-weight:500;color:var(--muted)}
.product{display:inline-flex;flex-direction:column;line-height:1.15}.product b{color:var(--ink);font-weight:600;font-size:15px;letter-spacing:.04em}
.tagline{font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.02em}
@media (max-width:560px){.tagline{display:none}}
.tabs-in{display:flex;justify-content:flex-start;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:1120px}
.tabs-in>:first-child{margin-left:auto}.tabs-in>:last-child{margin-right:auto}
.tabs-in::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;font-size:14px;font-weight:500;color:var(--muted);padding:10px 10px 9px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.badge{background:var(--overdue);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;line-height:17px;font-weight:600}

main{padding-block:24px 80px;display:grid;gap:24px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--border)}
.h1{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:0}
.lead{color:var(--muted);margin:6px 0 0;font-size:14px;max-width:60ch}
.eyebrow,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.eyebrow{text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.sec{display:grid;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 4px}
.sec-h h2{font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:0}
.sec-h .cnt{font-size:12px;color:var(--muted)}
.tsum{display:flex;gap:8px;overflow-x:auto;min-width:0;max-width:100%;padding:2px 0;scrollbar-width:none}.tsum::-webkit-scrollbar{display:none}
.tsum button{flex:none;border:0;background:var(--group);border-radius:12px;padding:8px 12px;display:grid;gap:1px;text-align:left;cursor:pointer;font:inherit;color:inherit;min-width:86px}
.tsum button b{font-size:19px;font-weight:600;line-height:1.1}.tsum button span{font-size:11.5px;color:var(--muted)}
.tsum button.on{background:var(--ink);color:#fff}.tsum button.on span{color:#ccc}
.tsum button.s-overdue b{color:var(--overdue)}.tsum button.s-late b{color:var(--late)}.tsum button.on b{color:#fff}
.tg{display:grid;gap:8px;min-width:0}.tg+.tg{margin-top:2px}
.tg-row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;justify-content:flex-end}
.tg-h{flex:1 1 300px;min-width:0;display:flex;align-items:center;gap:10px;background:var(--group);border:0;border-radius:var(--r);padding:12px 14px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.tg-h .tg-chev{flex:none;width:16px;color:var(--muted);transition:transform .15s}.tg.open .tg-chev{transform:rotate(90deg)}
.tg-t{flex:1;min-width:0;display:grid;gap:4px}.tg-t b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-m{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}.tg-m .o{color:var(--overdue);font-weight:600}.tg-m .s{color:var(--late);font-weight:600}
.tg-n{flex:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tg-row .btn{flex:none;align-self:center}
.list{display:grid;background:var(--group);border-radius:var(--r);overflow:hidden}
.list>p{padding:14px 16px}
/* Approvals: tick-and-approve rows (the whole row is the tap target) */
.q-row{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;min-height:44px}
.q-row:last-child{border-bottom:0}
.q-row input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--ink,#000);cursor:pointer}
.q-k{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q-fail{box-shadow:inset 3px 0 0 var(--overdue)}
.q-banner{box-shadow:inset 3px 0 0 var(--accent,#d7262b)}
/* Notifications: messages at the top of the inbox */
.n-msgs{display:grid;gap:10px;margin:4px 0 8px}
.n-msgs .callout{background:var(--group)}

.row{appearance:none;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 16px 12px 12px;display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:4px 16px;align-items:center;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(0,0,0,.03)}
.row-main{min-width:0}
.row-title{font-weight:500;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row-meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 6px;margin-top:2px}
.row-pn,.pn{font-size:12.5px;color:#C1272D;font-weight:500;margin-top:1px;line-height:1.35;overflow-wrap:anywhere}
.row-date{text-align:right;min-width:72px}
.row-date .lbl{font-size:11px}
.row-date .mono{font-size:13px}
@media (max-width:560px){
  .row{grid-template-columns:30px minmax(0,1fr) auto}
  .row>.chk{grid-row:1/3;align-self:start;margin-top:1px}
  .row-main{grid-column:2/-1}
  .row-date{text-align:left;display:flex;gap:6px;align-items:baseline;min-width:0}
}

.pill{--c:var(--muted);display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap;background:#fff;color:var(--ink)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.s-early{--c:var(--early)}.s-ontime{--c:var(--ontime)}.s-late{--c:var(--late)}.s-overdue{--c:var(--overdue)}.s-soon{--c:var(--late)}.s-open{--c:var(--faint)}.s-verify{--c:var(--early)}
.pill.s-overdue{color:var(--overdue)}
.tag{font-size:11px;font-weight:600;color:var(--muted);background:var(--fill);padding:1px 7px;border-radius:5px;white-space:nowrap}
.tag-req{background:var(--ink);color:#fff}
.tag-rev{font-family:var(--mono);font-weight:500}

.btn{appearance:none;font-size:14px;font-weight:600;border-radius:var(--r);padding:9px 16px;border:0;background:var(--fill);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--ink);color:#fff}
.btn-accent{background:var(--overdue);color:#fff}
.btn-danger{color:var(--overdue)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.linkish{appearance:none;background:none;border:0;padding:0;color:var(--ink);font-weight:500;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}

input,select,textarea{font-size:15px;background:var(--group);border:0;border-radius:var(--r);padding:10px 12px;width:100%;min-width:0;appearance:none}
select{background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%238E8E93' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:30px;cursor:pointer}
input[type="checkbox"]{appearance:auto;width:18px;height:18px;padding:0;accent-color:#000}
textarea{min-height:68px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:0}
.form input,.form select,.form textarea{background:#fff}
.field{display:grid;gap:6px}
.f-hint{font-size:12.5px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar>select,.bar>input{width:auto;flex:1 1 150px;min-width:0;max-width:100%}
#view{min-width:0}#view>*{min-width:0;max-width:100%}
.bar .grow{flex:1 1 auto}

.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;flex:none}
.seg button{border:0;background:none;font-size:13px;font-weight:500;padding:6px 12px;color:var(--ink);cursor:pointer;border-radius:7px}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .lab{font-weight:600;text-align:center;padding:0 4px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tile{background:var(--group);border-radius:var(--r-lg);padding:14px 16px;display:grid;gap:6px;align-content:start}
.tile .num{font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.tile .lbl{display:flex;align-items:center;gap:6px}
.tile[data-s] .lbl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.tile.dark{background:var(--ink);color:#fff}
.tile.dark .lbl{color:#999}

.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--fill);min-width:100px;gap:2px}
.stack span{display:block;background:var(--c)}
.stack.lg{height:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}

.tbl-wrap{overflow-x:auto;background:var(--group);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td .sub2{font-size:12.5px;color:var(--muted)}
td input,td select{min-width:130px;background:#fff}

.empty{background:var(--group);border-radius:var(--r-lg);padding:28px 22px;display:grid;gap:12px;justify-items:start}
.empty h3{margin:0;font-size:17px;font-weight:600}
.empty ol{margin:0;padding-left:20px;display:grid;gap:4px;color:var(--muted)}
.banner{background:var(--group);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.state{padding:60px 0;color:var(--muted);display:grid;gap:6px;text-align:center}
.state strong{color:var(--ink);font-weight:600;font-size:18px}

.card{background:var(--group);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.req-dates{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.arrow{color:var(--muted)}
.quote{border-left:2px solid var(--faint);padding-left:10px;margin:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--group);border-radius:999px;padding:5px 6px 5px 12px;font-size:13px}
.chip button{border:0;background:var(--fill);border-radius:50%;width:20px;height:20px;cursor:pointer;color:var(--muted);line-height:1}

#sheet{position:fixed;inset:0;z-index:20}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.3)}
.panel{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;overflow-y:auto;overscroll-behavior:contain;
  padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(36px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  display:grid;gap:16px;align-content:start;box-shadow:-8px 0 30px rgba(0,0,0,.08)}
.sh-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sh-title{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.2;overflow-wrap:anywhere}
.icon-btn{appearance:none;border:0;background:var(--group);border-radius:50%;width:32px;height:32px;font-size:18px;line-height:1;cursor:pointer;flex:none;color:var(--muted)}
.sh-status{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sh-status .pill{background:var(--group)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;background:var(--group);border-radius:var(--r);padding:14px 16px}
.facts .v{font-weight:500;font-size:16px;overflow-wrap:anywhere;margin-top:2px}
.facts .s{font-size:12px;color:var(--muted)}
.callout{background:var(--group);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;box-shadow:inset 3px 0 0 var(--late)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.form{display:grid;gap:12px;background:var(--group);border-radius:var(--r);padding:16px}
.form-title{font-weight:600}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.err{color:var(--overdue);font-size:13.5px;font-weight:500}
.tl{display:grid;border-left:1px solid var(--border);margin-left:4px}
.tl-item{position:relative;padding:0 0 16px 16px;display:grid;gap:2px;font-size:14px}
.tl-item::before{content:"";position:absolute;left:-4px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--faint)}
.tl-item:first-child::before{background:var(--ink)}
.tl-item time{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tl-note{font-size:13.5px;color:var(--muted);border-left:2px solid var(--border);padding-left:8px;margin-top:2px;overflow-wrap:anywhere}
.tl-task{font-size:13px;color:var(--muted)}


/* ---- dashboard widgets (ClickUp-style grid) ---- */
main.wide{max-width:1160px}
.widgets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.w{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px 16px;display:grid;gap:12px;align-content:start;min-width:0}
.w.span2{grid-column:span 2}
/* clients matrix: a 2 × 2 board of client cards */
.cm{display:grid;grid-template-columns:22px 1fr 1fr;grid-template-rows:auto auto auto;gap:8px}
.cm-col{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 4px}
.cm-row{display:flex;align-items:center;justify-content:center}
.cm-row span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.cm-q{border-radius:12px;padding:12px;display:grid;gap:10px;align-content:start;min-height:120px;min-width:0;background:#FAFAF8;border:1px solid var(--border)}
.cm-q-key{background:#FBF3F2;border-color:#F0D6D3}
.cm-q-grow,.cm-q-loyal{background:#F7F6F2}
.cm-qh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cm-qt{font-size:14px;font-weight:700;letter-spacing:-.01em}
.cm-q-key .cm-qt{color:#B3261E}
.cm-qd{font-size:12px;color:var(--muted);margin-top:2px}
.cm-qc{font-size:12px;font-weight:600;min-width:24px;height:24px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--border);padding:0 7px}
.cm-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.cm-card{background:#fff;border:1px solid var(--border);border-left:3px solid var(--pc);border-radius:10px;padding:9px 10px 8px;display:grid;gap:3px;min-width:0;--pc:var(--faint)}
.cm-card.cm-high{--pc:var(--overdue)} .cm-card.cm-medium{--pc:var(--late)} .cm-card.cm-low{--pc:var(--faint)}
.cm-n{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;min-width:0}
.cm-n i{flex:0 0 7px;height:7px;border-radius:50%;background:var(--pc)}
.cm-n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm-m{font-size:11.5px;color:var(--muted);line-height:1.35}
.cm-bar{height:3px;border-radius:2px;background:var(--group);margin-top:4px;overflow:hidden}
.cm-bar b{display:block;height:100%;background:var(--pc);border-radius:2px}
.wo-wrap{overflow-x:auto}
.wo-grid{display:grid;align-items:center;min-width:620px;row-gap:2px}
.wo-yr{font-size:11px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:visible}
.wo-mo{font-size:10px;color:var(--faint);text-align:center;padding-bottom:4px}
.wo-name{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;min-width:0;padding-right:8px;height:26px}
.wo-name i{flex:0 0 6px;height:6px;border-radius:50%}
.wo-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wo-cell{height:26px;display:flex;align-items:center;justify-content:center;border-top:1px solid var(--group)}
.wo-cell.jan{box-shadow:inset 1px 0 0 var(--fill)}
.wo-cell b{display:block;border-radius:50%;background:var(--c);opacity:.85}
.wo-form{gap:10px;background:var(--group)}
.wo-log{display:grid;gap:4px}
.wo-li{display:grid;grid-template-columns:72px 1fr auto auto;gap:10px;align-items:center;font-size:13px;padding:6px 0;border-top:1px solid var(--group)}
.cm-empty{font-size:12px;color:var(--faint);padding:18px 0;text-align:center}
@media (max-width:640px){.cm{grid-template-columns:1fr}.cm-corner,.cm-col,.cm-row{display:none}.cm-q{min-height:0}}
@media (max-width:760px){.w.span2{grid-column:auto}}
.w-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.w-t{font-size:14px;font-weight:600}
.w-s{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:grid;gap:4px}
.kpi .num{font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .lbl{display:flex;align-items:center;gap:6px}
.kpi[data-s] .lbl::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.kpi.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.kpi.dark .lbl{color:#9a9aa0}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:none}
.leg{display:grid;gap:6px;font-size:13px;flex:1;min-width:150px}
.leg div{display:flex;align-items:center;gap:8px}
.leg i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.leg b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.hb.hbw{grid-template-columns:minmax(0,110px) minmax(40px,1fr) auto}
.hb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.track{position:relative;height:12px;background:var(--group);border-radius:4px;display:flex;gap:2px;overflow:hidden}
.track span{display:block;height:100%;background:var(--c)}
.track span:first-child{border-radius:4px 0 0 4px}.track span:last-child{border-radius:0 4px 4px 0}
.track span:only-child{border-radius:4px}
.goal{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.cols{display:grid;grid-template-columns:28px 1fr;gap:6px}
.cols .yax{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--muted);text-align:right;height:150px;font-variant-numeric:tabular-nums}
.cols .plot{position:relative;height:150px;display:flex;align-items:flex-end;gap:10px;border-bottom:1px solid var(--border);background:linear-gradient(var(--border),var(--border)) 0 0/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat}
.cols .col{flex:1;display:flex;flex-direction:column-reverse;gap:2px;height:100%;justify-content:flex-start;min-width:0;cursor:default}
.cols .col span{display:block;background:var(--c);width:min(36px,100%);margin:0 auto}
.cols .col span:last-child{border-radius:4px 4px 0 0}
.cols .xax{grid-column:2;display:flex;gap:10px;font-size:11px;color:var(--muted)}
.cols .xax span{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl{display:grid}
.wl button{appearance:none;background:none;border:0;border-top:1px solid var(--line);padding:9px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;cursor:pointer;font-size:14px}
.wl button:first-child{border-top:0}
.wl .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl .m{font-size:12px;color:var(--muted);grid-column:1}
.wl .pn{grid-column:1;margin-top:0}
.wl .d{grid-row:1/4;grid-column:2;align-self:center;font-size:12.5px;font-weight:600;font-family:var(--mono)}
.w-empty{font-size:13px;color:var(--muted);padding:8px 0}
/* ---- board (kanban) ---- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start}
.kcol{background:var(--group);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;min-height:160px;transition:box-shadow .12s}
.kcol.over{box-shadow:inset 0 0 0 2px var(--ink)}
.kcol-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kcol-h .dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block;margin-right:7px}
.kcard{background:#fff;border-radius:10px;padding:10px 12px;display:grid;gap:6px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid var(--border);text-align:left}
.kcard[draggable="true"]{cursor:grab}
.kcard.dragging{opacity:.4}
.kcard .kt{font-weight:500;font-size:14px;overflow-wrap:anywhere}
.kcard .km{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 6px}
.kcard .kf{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.kcard .pill{background:var(--group);font-size:12px;padding:2px 8px}
.kempty{font-size:13px;color:var(--faint);text-align:center;padding:14px 0}
/* ---- timeline (gantt) ---- */
.gantt{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:#fff;--lab:240px}
@media (max-width:560px){.gantt{--lab:150px}}
.g-in{position:relative;min-width:max-content}
.g-row{display:grid;grid-template-columns:var(--lab) auto;border-bottom:1px solid var(--line)}
.g-row:last-child{border-bottom:0}
.g-lab{position:sticky;left:0;z-index:2;background:#fff;padding:6px 12px;border-right:1px solid var(--border);min-width:0;display:grid;align-content:center}
.g-lab .t{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.g-lab .m{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-row.proj .g-lab,.g-row.proj .g-trk{background:var(--group)}
.g-row.proj .g-lab .t{font-weight:600}
.g-trk{position:relative;height:36px}
.g-row.proj .g-trk{height:32px}
.g-head .g-lab{font-size:12px;color:var(--muted);font-weight:600}
.g-head .g-trk{height:44px}
.g-mon{position:absolute;top:4px;font-size:12px;font-weight:600;white-space:nowrap;padding-left:4px;border-left:1px solid var(--border)}
.g-tick{position:absolute;bottom:4px;font-size:11px;color:var(--muted);white-space:nowrap;transform:translateX(-50%)}
.g-bar{position:absolute;top:10px;height:16px;border-radius:5px;display:flex;overflow:hidden;cursor:pointer;min-width:4px}
.g-bar span{display:block;height:100%}
.g-bar .base{background:var(--c)}
.g-bar.open .base{opacity:.45}
.g-bar .ext{background:var(--c)}
.g-span{position:absolute;top:13px;height:6px;border-radius:3px;background:var(--faint)}
.g-ms{position:absolute;top:11px;width:13px;height:13px;transform:translateX(-50%) rotate(45deg);background:var(--c);border:2px solid #fff;box-shadow:0 0 0 1px var(--c);cursor:pointer}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--overdue);z-index:1;pointer-events:none}
.g-today::after{content:"Today";position:absolute;top:2px;left:4px;font-size:10px;font-weight:600;color:var(--overdue)}
.g-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);padding:0 4px}
.g-legend span{display:inline-flex;align-items:center;gap:6px}
.g-legend i{width:16px;height:8px;border-radius:3px;background:var(--c)}
.g-legend i.dia{width:9px;height:9px;transform:rotate(45deg);border-radius:1px}
.g-legend i.faded{opacity:.45}
/* ---- projects page ---- */
.pc-phases{display:flex;align-items:center;gap:8px;font-size:12.5px;flex-wrap:wrap}
.pc-dots{display:flex;gap:3px}
.pc-dots i{width:14px;height:6px;border-radius:3px;background:var(--fill)}
.pc-dots i.on{background:var(--ontime)}
.pc-dots i.wait{background:var(--late)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.pcard{appearance:none;text-align:left;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:grid;gap:7px;cursor:pointer;font:inherit;color:inherit;min-width:0}
.pcard:hover{border-color:var(--faint)}
/* completed projects: a quiet grey card with a round red rubber stamp, cut off by the card edge */
.pcard.done{position:relative;overflow:hidden;background:#F3F3F1;border-color:#E3E3DF}
.pcard.done:hover{border-color:#C9C9C4}
.pcard.done .pc-name{color:#3d3d3b}
.pcard.done .pc-bar span{background:#A3A39E}
.pc-stamp{position:absolute;right:-22px;top:-24px;width:116px;height:116px;transform:rotate(-12deg);pointer-events:none;color:rgba(196,30,41,.8);mix-blend-mode:multiply}
.pc-stamp svg{display:block;width:100%;height:100%;overflow:visible}
.pc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pc-top .pill{background:var(--group);font-size:12px}
.pc-code{font-size:12.5px;color:var(--muted)}
.pc-name{font-weight:600;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.pc-meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.pc-bar{height:8px;background:var(--group);border-radius:4px;overflow:hidden}
.pc-bar.lg{height:10px;background:#fff}
.pc-bar span{display:block;height:100%;background:var(--ontime);border-radius:4px}
.pc-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;min-width:0}
.pc-row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---- team page ---- */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.tcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:grid;gap:10px;align-content:start;min-width:0}
.tc-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tc-t{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.tc-s{font-size:12.5px;color:var(--muted)}
.prow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.ava{width:34px;height:34px;border-radius:50%;background:var(--group);display:grid;place-items:center;font-size:13px;font-weight:600;color:#3a3a3c}
.ava.lead{background:var(--ink);color:#fff}
.prow .nm{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .rl{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .ld{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.mini{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--group);white-space:nowrap;font-variant-numeric:tabular-nums}
.mini.bad{background:#FFE9E7;color:var(--overdue)}
.tc-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tc-stats div{background:var(--group);border-radius:8px;padding:7px 8px;display:grid;gap:1px}
.tc-stats b{font-size:17px;font-variant-numeric:tabular-nums}
.tc-stats span{font-size:11px;color:var(--muted);font-weight:600}
.sub-h{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:6;margin-top:4px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden;display:grid;max-height:300px;overflow-y:auto}
.sg{appearance:none;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;padding:10px 12px;display:grid;gap:2px;cursor:pointer;font:inherit;font-size:14px;color:var(--ink)}
.sg:last-child{border-bottom:0}.sg:hover,.sg:focus{background:var(--group)}
.sg-c{font-size:12px;color:var(--muted)}
/* ---- easy mode ---- */
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--faint);background:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;cursor:pointer;padding:0;align-self:center;flex:none}
.chk:hover{border-color:var(--ontime);background:#EAF8EE}
.chk.on{background:var(--ontime);border-color:var(--ontime);cursor:default}
.chk.hold{position:relative;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.chk.hold .hold-ring{position:absolute;inset:-5px;width:calc(100% + 10px);height:calc(100% + 10px);transform:rotate(-90deg);pointer-events:none;overflow:visible}
.chk.hold .hold-ring circle{fill:none;stroke:var(--ontime);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:66;stroke-dashoffset:66;transition:stroke-dashoffset .15s ease}
.chk.hold.holding .hold-ring circle{stroke-dashoffset:0;transition:stroke-dashoffset 1.2s linear}
.chk.hold.holding{background:#EAF8EE;border-color:var(--ontime)}
.chk.hold.on .hold-ring circle{stroke:var(--overdue)}
.chk.hold.on.holding{background:#FDECEB;border-color:var(--overdue)}
.chk.off{border-style:dashed;cursor:default;background:transparent}
.chk.vf{border-color:var(--early);color:var(--early);background:#fff;cursor:default;font-size:12px;line-height:1}
.row:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.toast-act{appearance:none;border:0;background:none;color:#7CC4FF;font:inherit;font-weight:700;margin-left:14px;padding:0;cursor:pointer}
#toast{display:flex;align-items:center}#toast[hidden]{display:none}
#fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:30px;line-height:1;cursor:pointer;z-index:15;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#fab[hidden]{display:none}
body.locked #fab{display:none}
.chip.qd{border:0;cursor:pointer;padding:6px 12px;display:grid;gap:0;text-align:left;border-radius:10px;background:#fff}
.chip.qd b{font-size:13px}.chip.qd span{font-size:11.5px;color:var(--muted)}
.chip.on{background:var(--ink)!important;color:#fff}.chip.on span{color:#ccc}
.more-i{appearance:none;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;font:inherit;color:inherit;width:100%}
.more-i:last-child{border-bottom:0}
.mi-t{font-weight:600}.mi-d{font-size:13px;color:var(--muted)}.mi-a{font-size:22px;color:var(--faint)}
main{padding-bottom:110px}
/* ---- JV unit chart ---- */
.lochart{display:grid;gap:10px;background:#fff;border-radius:10px;padding:12px}
.lo-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lo-b{background:var(--group);border-radius:8px;padding:8px 10px;display:grid;gap:1px}
.lo-b b{font-size:20px;font-variant-numeric:tabular-nums}.lo-b span{font-size:11.5px;color:var(--muted);font-weight:600}
.lo-b.lo{background:var(--ink);color:#fff}.lo-b.lo span{color:#bbb}
.ugrid{display:grid;gap:4px;overflow-x:auto}
.uc,.uh,.uf{appearance:none;font:inherit;border-radius:6px;min-height:34px;display:grid;place-items:center;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.uc{border:1px solid var(--border);background:#fff;color:var(--ink);cursor:pointer}
span.uc{cursor:default}
.uc.lo{background:var(--ink);border-color:var(--ink);color:#fff}
.uh{border:0;background:transparent;color:var(--muted);cursor:pointer;min-height:24px}
.uf{border:0;background:var(--group);color:#3a3a3c;cursor:pointer;font-size:11.5px}
span.uh,span.uf{cursor:default}
/* ---- profile icons ---- */
.ava.ic{background:var(--c);color:#fff}
.ava svg{width:62%;height:62%}
.ava-sm{width:18px;height:18px;font-size:8.5px;flex:none}
.ava-md{width:44px;height:44px;font-size:15px}
.ava-lg{width:64px;height:64px;font-size:22px}
span.ava{display:inline-grid;place-items:center;border-radius:50%;vertical-align:middle}
.who{display:inline-flex;align-items:center;gap:5px}
.mebtn{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-35%);appearance:none;border:0;background:none;padding:0;cursor:pointer}
.mebtn .ava{width:38px;height:38px}
.me-plus{position:absolute;right:-3px;bottom:-2px;width:16px;height:16px;border-radius:50%;background:var(--early);color:#fff;font-size:12px;font-weight:700;line-height:16px;text-align:center;border:2px solid #fff;box-sizing:content-box}
.icgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.icopt{appearance:none;border:2px solid transparent;background:var(--group);border-radius:12px;padding:10px 4px 8px;display:grid;justify-items:center;gap:6px;cursor:pointer;font:inherit}
.icopt.on{border-color:var(--ink);background:#fff}
.icopt:disabled{cursor:not-allowed}
.icopt:disabled .ava{filter:grayscale(1);opacity:.35}
.icn{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icopt.on .icn{color:var(--ink);font-weight:600}
/* ---- client revisions ---- */
.rev-item{border-bottom:1px solid var(--line)}.rev-item:last-child{border-bottom:0}
.rev-item .row{border-bottom:0}
.rev-fb{font-size:12.5px;color:var(--muted);padding:0 16px 12px 54px;margin-top:-4px;overflow-wrap:anywhere}
/* ---- meetings ---- */
.mt-card{gap:8px}
.mt-att{grid-template-columns:minmax(0,1fr) auto;align-items:center}@media (max-width:620px){.mt-att{grid-template-columns:minmax(0,1fr)}}
.mt-sec>.sec-h h2{font-size:13px}
.mt-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.mt-row:last-child{border-bottom:0}.mt-row:hover{background:rgba(0,0,0,.03)}
.mt-row .mi-a{font-size:22px;color:var(--faint)}
.mt-wk span.ava:not(.ic):not(.lead),.who span.ava:not(.ic):not(.lead),.chip span.ava:not(.ic):not(.lead),.row-meta span.ava:not(.ic):not(.lead),.kf span.ava:not(.ic):not(.lead){background:#fff;color:#3a3a3c;box-shadow:inset 0 0 0 1px var(--border)}
.chip.on span.ava:not(.ic){background:#444;color:#fff;box-shadow:none}
.mt-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.mt-wk{background:var(--group);border-radius:10px;padding:8px 4px;display:grid;justify-items:center;gap:4px;text-align:center}
.mt-wk.me{background:#fff;box-shadow:inset 0 0 0 2px var(--ink)}
.mt-g{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mt-g.me{color:var(--early);font-weight:600}
.mt-nm{font-size:12px;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---- notifications ---- */
.top-in{position:relative}
.bell{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-35%);appearance:none;border:0;background:var(--group);width:38px;height:38px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.bell svg{width:19px;height:19px}
.bell .badge{position:absolute;top:-3px;right:-4px;min-width:18px;text-align:center;border:2px solid #fff}
.n-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.n-sum div{background:var(--group);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.n-sum b{font-size:20px;font-variant-numeric:tabular-nums}
.n-sum span{font-size:11.5px;color:var(--muted);font-weight:600}
.n-day{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:6px 4px 0}
.panel{grid-auto-rows:max-content}
.n-list{display:grid;background:var(--group);border-radius:var(--r);overflow:hidden}
.n-item{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:4px 10px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
.n-item:last-child{border-bottom:0}
.n-item .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:transparent}
.n-item.unread .dot{background:var(--c)}
.n-item .nt{font-weight:500;font-size:14px;cursor:pointer;text-align:left;background:none;border:0;padding:0;overflow-wrap:anywhere}
.n-item:not(.unread) .nt{color:#3a3a3c;font-weight:400}
.n-item .nb{grid-column:2;font-size:13px;color:var(--muted);white-space:pre-line;overflow-wrap:anywhere}
.n-item .nm{grid-column:2;font-size:11.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.n-item .na{grid-row:1/4;grid-column:3;appearance:none;border:0;background:#fff;border-radius:8px;font-size:12px;font-weight:600;padding:6px 9px;cursor:pointer;color:var(--muted);align-self:start}
.n-cat{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c)}

.cal-row{appearance:none;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left;font:inherit;color:inherit;padding:10px 16px 10px 12px;display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;cursor:pointer;box-shadow:none!important;border-radius:0;font-size:15px}
.cal-row:last-child{border-bottom:0}
.cal-row:hover{background:rgba(0,0,0,.03)}
.cr-bar{align-self:stretch;border-radius:2px;background:var(--c,var(--kc))}
.cal-row.ce-meet .cr-bar,.cal-row.ce-fb .cr-bar,.cal-row.ce-remind .cr-bar{background:var(--kc)}
.cr-t{font-weight:500;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.cal-row.done .cr-t>span:first-child{text-decoration:line-through;color:var(--muted)}
.cr-m{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 5px;margin-top:2px}
@media (max-width:700px){
  .cal-c{min-height:52px;padding:4px 2px;align-items:center}
  .cal-n{justify-content:center;font-size:14px}
  .cal-items{display:none}
  .cal-dots{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
  .cal-dots i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--kc))}
  .cal-dots i.ce-meet,.cal-dots i.ce-fb,.cal-dots i.ce-remind{background:var(--kc)}
  .cal-c.sel{box-shadow:none}.cal-c.sel .cal-n span{background:var(--ink);color:#fff}
  .cal-c.today.sel .cal-n span{background:var(--overdue)}
  .cal-row{grid-template-columns:4px minmax(0,1fr)}
  .cal-row .pill{grid-column:2;justify-self:start}
}
.nb-card{gap:8px}.nb-card.unseen{box-shadow:inset 3px 0 0 var(--early)}.nb-card.imp{box-shadow:inset 3px 0 0 var(--overdue)}
.nb-title{margin:0;font-size:16px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.nb-body{white-space:pre-line;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.nb-body.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.nb-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rv-list{display:grid;gap:2px;background:var(--group);border-radius:var(--r);padding:6px}
.rv-row{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:10px;background:#fff}
.rv-row .rv-n{flex:1;min-width:0;display:grid;gap:2px}.rv-row .rv-n b{font-weight:600;font-size:13.5px}
.rv-row .rv-q{font-size:12.5px;color:var(--muted);white-space:pre-line;overflow-wrap:anywhere}
.rv-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;color:#fff;background:var(--c,var(--faint));align-self:center}
.rv-tag.wait{background:var(--fill);color:var(--muted)}
.rv-sum{font-size:12.5px;color:var(--muted)}
.rv-btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rv-btns .btn{justify-content:center;padding-left:6px;padding-right:6px}.rv-btns .btn.on{background:var(--c);border-color:var(--c);color:#fff}
/* Back: one ‹ in the same top-left spot on every inner page, kept in view under the tab bar while the page scrolls */
.nav-back{position:sticky;top:calc(var(--chrome-h,0px) + 8px);z-index:4;justify-self:start;align-self:start;display:inline-flex;align-items:center;gap:2px;
  min-height:40px;margin:-4px 0 -6px -6px;padding:0 14px 0 6px;border:0;border-radius:999px;background:rgba(242,242,247,.92);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);font:600 15px var(--font);letter-spacing:-.01em;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:color .12s,background-color .12s}
.nav-back svg{width:22px;height:22px;flex:none}
.nav-back:active{color:#d7262b;background:var(--fill)}
@media (hover:hover){.nav-back:hover{background:var(--fill)}}
.nav-back:focus-visible,.sh-back:focus-visible{outline:2px solid #d7262b;outline-offset:2px}
/* sheets: ‹ on the left when back leads to the sheet underneath, × on the right closes; both stay in view while the sheet scrolls */
.sh-head .sh-ht{flex:1;min-width:0}
.sh-head .icon-btn{width:36px;height:36px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.sh-back{display:inline-grid;place-items:center;color:var(--ink)}
.sh-back svg{width:20px;height:20px}
.sh-head .icon-btn:active{color:#d7262b;background:var(--fill)}
.panel>.sh-head:first-child{position:sticky;top:calc(-18px - env(safe-area-inset-top,0px));z-index:3;background:#fff;margin-top:calc(-18px - env(safe-area-inset-top,0px));padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:10px;margin-bottom:-10px}
@media (max-width:640px){.panel>.sh-head:first-child{top:calc(-12px - env(safe-area-inset-top,0px));margin-top:calc(-12px - env(safe-area-inset-top,0px));padding-top:calc(12px + env(safe-area-inset-top,0px))}}
@media (prefers-reduced-motion:reduce){.nav-back{transition:none}}
</style>

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const TEAMS_DEFAULT=['Pod 1','Pod 2','Pod 3','Pod 4','Drafting Pool','Visualization',"Principal's Office"];
const pods=()=>teams().filter(t=>/^pod\b/i.test(t));
const podsOfProject=p=>p?[...new Set([p.pod,p.pod2,...(Array.isArray(p.pods)?p.pods:[])].filter(x=>x&&x!=='Studio'))]:[];
/* studio-work projects can hold several pods: each task then belongs to its assignee's pod, so pods aren't scored for each other's work */
/* a pod leader changes tasks only on projects their pod runs (the database enforces the same) */
const leadsProj=pid=>amApprover()||(amMgr()&&!!myPod()&&podsOfProject(S.projects[pid]).includes(myPod()));
const podsOf=t=>{ const p=t._p||S.projects[t.projectId], ps=podsOfProject(p);
  if(ps.length>1&&isInternalP(p)){ const tm=t._team||teamOf(t.assignee||(t.assignReq&&t.assignReq.to)); return [ps.includes(tm)?tm:ps[0]]; }
  return ps.length?ps:[podOf(t)]; };
/* people added to a project (beyond its pods): approved by the COO; members from another pod are temporary */
const projMembers=p=>Object.entries((p&&p.members)||{}).filter(([id,m])=>m&&typeof m==='object');
const memberOf=(p,id)=>{ const m=p&&p.members&&p.members[id]; return m&&typeof m==='object'?m:null; };
const isMemberOk=(p,id)=>{ const m=memberOf(p,id); return !!m&&m.status==='approved'&&isLive(p)&&(!m.until||m.until>=today()); };
const podOf=t=>{const p=t._p||S.projects[t.projectId]; const pp=p&&p.pod; if(pp&&pp!=='Studio') return pp; const tm=t._team||teamOf(t.assignee); return /^pod\b/i.test(tm)?tm:'Studio';};
const target=()=>(S.settings&&+S.settings.target)||90;
const ST={early:'Done in advance',ontime:'Done on time',late:'Done late',overdue:'Overdue',soon:'Due soon',open:'In progress',verify:'Awaiting verification'};
const KEYS=['early','ontime','late','overdue','open'];

const S={db:null,user:null,uid:null,me:null,isOwner:false,canWrite:true,state:'loading',
  settings:null,members:{},projects:{},tasks:{},shared:{},priv:{},paths:{},privSubs:{},types:{},roleReq:{},roleSubs:{},assignPick:{},typeSubs:{},profiles:{},podNames:{},podSubs:{},podReq:{},podJoin:{},podReqSubs:{},podJoinSubs:{},
  view:'mine',f:{project:'',person:'',status:'active',q:''},
  dash:{kind:'month',offset:0,basis:'approved',group:'person',pod:''},
  nst:null,lib:{},meetings:{},pmeet:{},meetRota:null,nview:{tab:'inbox',cat:''},act:{person:'',project:''},board:{project:'',person:'',stage:'todo'},gantt:{zoom:'quarter',offset:0,project:'',person:'',pod:''},sheet:null,busy:false,declineNote:{},newTeam:'',
  pendingRender:false,pendingSheet:false,creatingSettings:false};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function h(tag,props,...kids){
  const el=document.createElement(tag);
  if(props) for(const [k,v] of Object.entries(props)){
    if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k==='text') el.textContent=v;
    else if(k.startsWith('on')&&typeof v==='function') el.addEventListener(k.slice(2),v);
    else if(k.includes('-')||k==='for'||k==='list') el.setAttribute(k,v);
    else if(k in el){ try{el[k]=v}catch(e){el.setAttribute(k,v)} }
    else el.setAttribute(k,v);
  }
  for(const c of kids.flat(Infinity)){ if(c==null||c===false||c==='') continue; el.append(c instanceof Node?c:String(c)); }
  return el;
}
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const utc=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const diff=(a,b)=>Math.round((utc(b)-utc(a))/864e5);
function addDays(s,n){const [y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+n))}
function fmtD(s){ if(!s) return '—'; const [y,m,d]=s.split('-').map(Number); return `${d} ${MON[m-1]}${y!==new Date().getFullYear()?' '+y:''}`; }
function fmtTs(iso){ if(!iso) return ''; const d=new Date(iso); return `${fmtD(ymd(d))}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; }

function nameOf(id){
  if(!id) return 'Unassigned';
  const r=S.settings&&S.settings.roster&&S.settings.roster[id];
  const n=(r&&r.label)||(S.profiles[id]&&S.profiles[id].name)||(id===S.uid?((S.me&&S.me.name)||'You'):'Team member');
  return S.members[id]&&S.members[id].active===false?n+' (left)':n;
}
const roster=id=>(S.settings&&S.settings.roster&&S.settings.roster[id])||{};
const teamOf=id=>{ const r=roster(id), d=podDecision(id); if(d&&(!r.teamAt||(d.at||'')>r.teamAt)) return d.team||'No team set'; return r.team||'No team set'; };
const validDecider=a=>a===ownerId()||isApprover(a);
function podDecision(id){ let best=null; for(const [a,docs] of Object.entries(S.podJoin)){ if(!validDecider(a)) continue; const d=docs[id]; if(d&&d.status==='approved'&&(!best||(d.at||'')>(best.at||''))) best=d; } return best; }
function decisionFor(pid,reqAt){ for(const [a,docs] of Object.entries(S.podJoin)){ if(!validDecider(a)) continue; for(const k of [pid,'d-'+pid]){ const x=docs[k]; if(x&&x.reqAt===reqAt) return x; } } return null; }
function podRequests(){ const out=[]; for(const [a,docs] of Object.entries(S.podReq)) for(const [pid,d] of Object.entries(docs)){ if(!d||!d.pod||!isPodLead(a,d.pod)||decisionFor(pid,d.at)) continue; out.push({author:a,pid,d}); } return out.sort((x,y)=>(x.d.at||'').localeCompare(y.d.at||'')); }
function myPodReqs(){ return Object.entries(S.podReq[S.uid]||{}).map(([pid,d])=>({pid,d,dec:decisionFor(pid,d.at)})); }
const roleOf=id=>roleLabel(roster(id).role);
const teams=()=>(S.settings&&S.settings.teams)||TEAMS_DEFAULT;
const ownerId=()=>S.settings&&S.settings.ownerId;
const isMgr=id=>!!id&&(id===ownerId()||((S.settings&&S.settings.managers)||[]).includes(id));
const amMgr=()=>S.isOwner||isMgr(S.uid);
const isApprover=id=>!!id&&(id===ownerId()||((S.settings&&S.settings.approvers)||[]).includes(id));
const amApprover=()=>S.isOwner||isApprover(S.uid);
/* the COO approves; only the Principal and the COO give the COO tasks (they stay private) */
/* only the Principal and the COO can give work to the Principal's Office */
const isPO=id=>!!id&&(id===ownerId()||/principal/i.test(teamOf(id)));
const canAssignTo=id=>(!isPO(id)||amApprover())&&(!isChalkP(id)||S.isOwner);
const isCOO=id=>!!id&&id!==ownerId()&&(isApprover(id)||/\bcoo\b|chief operat/i.test(roleOf(id)));
/* Chalk Create: a separate SBU. Its lead and the Principal assign Chalk work; the COO views and edits; no SLATE process or scoring */
const isChalkName=t=>/^\s*chalk\s*create\s*$/i.test(t||'');
const chalkTeam=()=>teams().find(isChalkName)||'Chalk Create';
const isChalkP=id=>!!id&&isChalkName(teamOf(id));
const isChalkProj=p=>!!p&&isChalkName(p.pod);
const isChalkTask=t=>!!t&&isChalkProj(t._p||S.projects[t.projectId]);
const chalkLeads=()=>(S.settings&&S.settings.chalkLeads)||[];
const isChalkLead=id=>!!id&&chalkLeads().includes(id);
const amChalkLead=()=>isChalkLead(S.uid);
const amChalkMember=()=>!S.isOwner&&isChalkP(S.uid);
const canChalkView=()=>S.isOwner||isCOO(S.uid)||amChalkLead();
const canChalkAssign=()=>!!S.canWrite&&(S.isOwner||amChalkLead());
const canChalkEdit=()=>!!S.canWrite&&canChalkView();
const chalkPeople=()=>people().filter(id=>isChalkP(id)||isChalkLead(id));
const chalkProjects=()=>Object.entries(S.projects).map(([id,p])=>({...p,id})).filter(p=>isLive(p)&&isChalkProj(p)).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
/* people who left SLATE (account closed): kept for history, out of every list */
function isLeft(id){ return !!id&&!!S.members[id]&&S.members[id].active===false; }
function leftOn(id){ return isLeft(id)?(S.members[id].leftOn||''):''; }
function people(){ const ids=new Set(Object.keys(S.members).filter(id=>!isLeft(id))); if(ownerId()) ids.add(ownerId()); if(S.uid) ids.add(S.uid); return [...ids].sort((a,b)=>nameOf(a).localeCompare(nameOf(b))); }
const isLive=p=>!!p&&(!p.status||p.status==='active');
function projectReqs(){ return Object.entries(S.projects).map(([id,p])=>({...p,id})).filter(p=>p.status==='pending'||p.status==='declined').sort((a,b)=>(a.requestedAt||'').localeCompare(b.requestedAt||'')); }
function projects(){ return Object.entries(S.projects).map(([id,p])=>({...p,id})).filter(p=>isLive(p)&&!isChalkProj(p)).sort((a,b)=>(a.code||a.name||'').localeCompare(b.code||b.name||'')); }
const privIds=()=>(S.settings&&S.settings.privateIds)||[];
const isPriv=id=>privIds().includes(id);
/* only approvers add projects; only pod leads may request one for their pod (the database refuses anyone else) */
const canProjReq=()=>amApprover()||amPodLead();
const seePriv=()=>S.isOwner||isCOO(S.uid);
const fullView=()=>S.isOwner||isApprover(S.uid)||(isMgr(S.uid)&&!myPod());
const amPodLead=()=>!!myPod()&&isPodLead(S.uid,myPod());

/* One save at a time. A slow one says "Saving…"; a tap meanwhile is told to wait; every save ends within 15 s

async function run(fn,ok){

  S.busy=true; if(S.sheet) renderSheet();

const histText=e=>{

    case 'assignApproved': return e.to===e.from?`${by} approved assigning it to ${nameOf(e.to)}`:`${by} assigned it to ${nameOf(e.to)} instead of ${nameOf(e.from)}`;
    case 'assignDeclined': return `${by} declined assigning it to ${nameOf(e.to)}`;

    case 'reassigned': return `${by} reassigned it from ${nameOf(e.from)} to ${nameOf(e.to)}`;
    case 'target': return `${by} changed the target from ${fmtD(e.from)} to ${fmtD(e.to)} (now Date ${e.rev+1})`;
    case 'request': return e.replaced?`${by} changed the date request to ${fmtD(e.to)} (was ${fmtD(e.replaced)}; current target ${fmtD(e.from)})`:`${by} requested a new date: ${fmtD(e.to)} (current target ${fmtD(e.from)})`;

 ['start','all','Turn on notifications',['Tap Turn on in the notification banner, or More › Account › Turn on notifications.','Allow notifications when the phone asks.'],'You get alerts for tasks, approvals and messages even when the app is closed.','If you blocked them by mistake, allow them for SLATE OS in your phone’s settings. Turn them on separately on each device you use.'],
 ['start','all','Set my profile icon',['Tap your picture at the top left.','Pick an icon. Each icon belongs to one person only.','To go back to initials, tap Use my initials instead.'],null,null],
 ['start','all','Report a problem with the app',['Tap the ! button at the bottom left (Report an issue on larger screens).','Describe the problem and tap Send report.'],'The Principal and COO are told. Follow it in More › Report log: Open, Being fixed, Fixed or Closed.','The screen you were on is attached for you.'],

 // ---- tasks
 ['tasks','all','See what I have to do today',['Open Home.','Read Needs attention first: overdue work and anything due in the next 3 days.','Then My checklist, Waiting for an approved date and In progress.'],null,'Messages from the Principal or COO sit at the top of Home until you answer them.'],
 ['tasks','all','Add a task for myself',['Tap New task (or the round + button).','Type the task, or pick a suggestion.','Choose the Project and yourself under Assign to.','Pick a proposed date with the chips or the date box.','Tap Add task.'],'The task is yours at once. The date is a proposal until the COO approves it; only approved dates count.','Use More options for a category, note, start date or a weekly/monthly repeat.'],
 ['tasks',['lead','boss'],'Give a task to someone in my pod',['Tap New task.','Choose the Project, then the person under Assign to.','Pick a date: pod leads propose it, the COO and Principal set it directly.','Tick This is a deliverable if it is a submission.','Tap Add task. The sheet stays open for the next one.'],'The person is notified. A pod lead’s date waits for the COO.','Added just now lists what you created in this sheet.'],
 ['tasks',['lead','head','boss'],'Get help from the drafting pool or another pod',['Create the task (or open it › Edit or reassign).','Choose a drafter, visualiser or someone from another pod.','Save.'],'It becomes an assignment request: the task shows “awaiting approval” until the COO approves, picks someone else, or declines.','Drafting leads: leave the date as a proposal. Adding a person to the project team (Project › + Add people) avoids asking for every task.'],
 ['tasks','lead','Ask for a new standard task',['Tap New task.','Below the form, tap Can’t find the task? Request a new standard task.','Write a title that works for any project, pick the category, tick Deliverable if it is one.','Tap Send for approval.'],'The COO adds it to the standard list or declines it with a note. Once added, it appears in everyone’s suggestions.','You can withdraw it while it is waiting.'],
 ['tasks','all','Know a task from a deliverable',['A deliverable is a submission (a set, a presentation, a gate). Tick This is a deliverable when you create it.','Everything else is a task.'],'Deliverables carry a tag, a diamond on the Timeline and the Calendar, and weigh 3 points against 1 for a task.',null],
 ['tasks','all','Mark a task done',['Tap the circle on the task row, or open it and tap ✓ Done today.','Finished on an earlier day? Open it › Done on another date, pick the date, add a note if useful, tap Mark as done.'],'It is scored against the approved target: done in advance, on time or late. If verification is on for that kind of task, it goes to the Principal or the COO first and counts once verified, dated the day you finished. Undo is offered for a few seconds.','A phase’s final gate deliverable can’t be marked done while its checklist has open items.'],
 ['tasks','all','Move my work across the Board',['Tasks › Board.','On a computer, drag the card to To do, In progress, In review or Done.','On a phone, use the ← Prev / Next → buttons on the card.'],'Dropping on Done asks for the completion date.','You can move only your own cards (managers can move their pod’s).'],
 ['tasks','all','Find a task',['Open Tasks.','Type in Search tasks: title, project, code or person.','Filter by Project, Person and Status (Open, Overdue, Due soon, Date requests, Completed, Archived…).'],null,'Switch between List, Board and Timeline at the top; the app remembers your choice.'],
 ['tasks','all','Plan on the Timeline',['Tasks › Timeline.','Choose 6 weeks, 3 months or 6 months; move with ‹ Today ›.','Filter by project or person.'],'Bars run from the start date to the target; late time shows in red.','Tasks without an approved date are not drawn. Set a Start date in Edit to give a bar its true length.'],
 ['tasks','all','The client sent changes after I finished',['Open the completed task.','Tap + Client revision.','Write what the client asked for, when the feedback came, and the (proposed) submission date.','Tap Add revision.'],'A new linked task “… · Revision 1” is created. The original stays done and on time.','Completed tasks are locked; this is the way to add more work to them.'],
 ['tasks',['lead','boss'],'Rename, reassign or change a task',['Open the task.','Tap Rename for the name, or Edit or reassign for type, project, person, start date and repeat.','Save.'],'Every change is kept in the task’s history; the old name too.','Once a task is done, only the Principal or COO can edit it.'],
 ['tasks',['lead','boss'],'Remove a task that is no longer needed',['Open the task › Archive.','Add a reason, e.g. Dropped from scope, and confirm.'],'It leaves the lists and the dashboard but keeps its history.','Nothing is deleted. To bring it back: Tasks › Status: Archived › open it › Restore.'],
 ['tasks','boss','Reopen a completed task or fix its completion date',['Open the task.','Tap Reopen, or Correct completion date.','Give the reason (required) and save.'],'The change and the reason stay in the history.','Use it for real mistakes only; client changes go in as + Client revision.'],
 ['tasks','all','Make a task repeat every week or month',['When creating it, open More options › Repeat (or Edit or reassign › Repeat).','Choose Repeats weekly or Repeats monthly.'],'When you mark it done, the next one is created for the same person with its date already set.','Choose Does not repeat to stop the series.'],
 ['tasks','all','Read a task’s history',['Open the task.','The top shows the current target and which date it is (Date 2, Date 3…).','The Date log lists every date in order, with who asked, the reason and who approved it; History has every change.'],'Date 1 is the first approved date; each approved change is Date 2, Date 3…',null],
 ['tasks','boss','Keep the Principal’s and COO’s tasks private',['Tasks for a private person are stored apart automatically.','The Principal can mark someone private in More › Settings › People › Private tasks.'],'Only the Principal and the COO see them. They never appear on the dashboard or in anyone else’s lists.','A private task can’t be reassigned; archive it and create a new one.'],

 ['dates',['member','lead','head'],'Ask for more time',['Open the task › Request new date.','Pick the new date (chips: +2 days, +1 week, +2 weeks, or any date).','Tap a reason chip, e.g. Waiting for client input, and add detail.','Tap Send for approval.'],'The COO approves or declines. Your current date stays until then; the row shows Date request.','Ask the day you know you will be late, not on the due date. If the client or a consultant caused the delay, say so in the reason.'],
 ['dates',['lead','boss'],'Propose dates for a whole project',['Tasks › beside the project heading, tap Propose timeline (or Set timeline).','Enter a date for each task. You can leave some for later.','Tap Send for approval (or Set dates).'],'Pod leads’ dates go to the COO; the Principal’s and COO’s count at once.',null],
 ['dates','lead','Propose a date for a task that has none',['Open the task › Propose date.','Pick the date, add a note if useful.','Tap Send for approval.'],'It shows “Waiting for the COO’s approval” until decided.',null],
 ['dates','boss','Verify completed work',['Approvals › Completed work, or open the task from the notification.','Check the work, then tap Verify.','To send it back, write what needs fixing and tap Return.'],'Verified work counts as done on the day the person finished it, so a slow check never makes them late. Returned work reopens with your note.','Routine ones can be ticked in Approve together. Settings › Completion verification sets which kinds of task need it.'],
 ['dates','boss','Approve dates and requests',['Approvals (the tab beside Home; Home shows how many are waiting).','Approve together: first timelines, support, phase dates and standard tasks start ticked; revised dates and people moves start unticked so you read each one.','Tap Approve N selected (tap twice). Anything that didn’t save stays ticked with the reason.','To add a note, decline or return, use the cards below: a project’s first timeline is one card; revised dates are approved or declined one by one.'],'Approved dates become the target; changes become Date 2, Date 3… and Date 1 stays on record.','Fast-track projects are listed first and marked “decide today”. A tapped notification about a request opens Approvals or the task itself.'],
 ['dates','boss','Change a target date directly',['Open the task › Change target date (or Set target date).','Enter the new date and the reason.','Tap Save date.'],'It becomes the next revision; the original target stays on record.',null],

 ['projects','boss','Pause, close or reopen a project',['Open the project › Close project.','Choose how it ended: On hold, Completed, Closed after phase or Cancelled.','Give the reason and date (and the last phase reached, the scope delivered, or a review date for on hold), then save.'],'On hold freezes open tasks until you resume it; closing drops them. Neither counts against anyone, and finished work keeps its score.','Pod leaders can ask from the project page; requests arrive in Approvals. Only the Principal reopens an archived project.'],

const hdFor=(e,r)=>e[1]==='all'||(Array.isArray(e[1])?e[1].includes(r):e[1]===r);
const hdRoleNames=e=>e[1]==='all'?'Everyone':(Array.isArray(e[1])?e[1]:[e[1]]).map(r=>HD_ROLES[r]).join(' · ');
function hxHowDo(role){
  const st=S.hd||(S.hd={q:'',topic:'',all:false});
  const list=h('div',{class:'hd-list'});
  const empty=h('p',{class:'f-hint hd-empty',hidden:true,text:'Nothing matches. Try other words, or show all roles.'});
  const items=HOWDO.map(e=>{ const [tp,,q,steps,after,note]=e;
    const el=h('details',{class:'hd-item','data-tp':tp,'data-txt':(q+' '+steps.join(' ')+' '+(after||'')+' '+(note||'')).toLowerCase()},
      h('summary',{},h('span',{class:'hd-q',text:q}),h('span',{class:'hd-who',text:hdRoleNames(e)})),
      h('ol',{class:'hd-steps'},steps.map(s=>h('li',{text:s}))),
      after?h('div',{class:'hd-after'},h('b',{text:'What happens next '}),h('span',{text:after})):null,
      note?h('div',{class:'hd-note'},h('b',{text:'Good to know '}),h('span',{text:note})):null);
    el._e=e; return el; });
  list.append(...items);
  const apply=()=>{ if(st.topic&&!st.all&&!HOWDO.some(e=>e[0]===st.topic&&hdFor(e,role))) st.topic=''; const q=st.q.trim().toLowerCase(); let n=0;
    for(const el of items){ const ok=(st.all||hdFor(el._e,role))&&(!st.topic||el.dataset.tp===st.topic)&&(!q||q.split(/\s+/).every(w=>el.dataset.txt.includes(w)));
      el.hidden=!ok; if(ok) n++; if(!ok) el.open=false; }
    empty.hidden=n>0; cnt.textContent=n+' of '+HOWDO.length;
    chips.querySelectorAll('.chip').forEach(c=>{ const k=c.dataset.k; c.hidden=!!k&&!st.all&&!HOWDO.some(e=>e[0]===k&&hdFor(e,role)); }); };
  const chips=h('div',{class:'chips hd-topics'},[['','All topics'],...HD_TOPICS].map(([k,l])=>{ const b=h('button',{type:'button','data-k':k,class:'chip'+(st.topic===k?' on':''),onclick:()=>{ st.topic=k; chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b)); apply(); },text:l}); return b; }));
  const cnt=h('span',{class:'hd-cnt'});
  const bar=h('div',{class:'hd-bar'},
    h('input',{type:'search',class:'hd-search',placeholder:'Search, e.g. more time, site visit, password',value:st.q,'aria-label':'Search the how-to',oninput:e=>{ st.q=e.target.value; apply(); }}),
    h('label',{class:'hd-allr'},h('input',{type:'checkbox',checked:st.all,onchange:e=>{ st.all=e.target.checked; apply(); }}),'Show every role'),cnt);
  apply();
  return h('div',{class:'hd'},bar,chips,list,empty);
}

/* ---------- back navigation ----------
   Phones send one "back" whatever the person's gesture setting: a swipe in from either edge, the back key of the
   3-button bar, Samsung or Xiaomi shortcuts. So do the mouse's back button and Alt+←. All of them arrive here as one
   history step, so SLATE OS follows every setting without needing to know which one is on.
   Each step deeper is one entry: a page under More, a sheet, a sheet opened from a sheet, a form inside a sheet, a popup.
   Back undoes exactly one step, tabs included: back from a tab returns to the tab before it. Tapping a tab already
   on the way back steps back to it rather than adding it again, so the trail never repeats itself.
   Back on Home asks once before closing SLATE OS. The on-screen ‹ and × buttons take the same path, so the phone's
   back and the buttons never disagree. */
const NAV={i:0,stack:[],snap:[],ready:false,applying:false,pending:0,pendT:0,hintAt:0};
const NAV_SUB=['notice','activity','setup','std','help','far','reports','backup','entries'];   /* pages reached from More */
const NAV_TASKV=['all','board','gantt'];                                                      /* one tab, three layouts */
const NAV_VIEWER=['task','projView','notif','profile','myprofile','meeting','pmeet','timeline','chalkProj','rota'];  /* sheets that open other sheets */
const NAV_OV='.slate-sheet:not(#slate-auth),#share-card';                                     /* popups laid over everything */
const navTab=v=>NAV_TASKV.includes(v)?'all':v;
const navIsTab=v=>!NAV_SUB.includes(v);
const navSheetKey=sh=>sh?[sh.type,sh.id??sh.projectId??sh.key??sh.k??sh.date??sh.uid??'',sh.mode&&sh.mode!=='view'?sh.mode:''].join(':'):'';
const navOvs=()=>[...document.querySelectorAll(NAV_OV)];
const navLoc=()=>({v:S.view,s:navSheetKey(S.sheet),o:navOvs().length});
const navSame=(a,b)=>!!a&&!!b&&a.v===b.v&&a.s===b.s&&a.o===b.o;
const navSnapNow=()=>({sheet:S.sheet?{...S.sheet,d:S.sheet.d&&typeof S.sheet.d==='object'&&!Array.isArray(S.sheet.d)?{...S.sheet.d}:S.sheet.d}:null,y:window.scrollY});
const navStandalone=()=>{ try{ return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true; }catch(e){ return false; } };
const navState=(i,L,extra)=>({slate:1,i,L,...(extra||{})});
const navHomeL=()=>({v:'mine',s:'',o:0});
/* every new screen gets its own entry; switching layout within a tab (list, board, timeline) or one form to the next replaces it */
function navDecide(cur,L){
  if(!cur) return 'replace';
  if(L.v!==cur.v){
    if(navTab(L.v)===navTab(cur.v)) return 'replace';
    return 'push';
  }
  if(L.o>cur.o) return 'push';
  if(!cur.s&&L.s) return 'push';
  if(cur.s&&L.s){
    const [ct,ci,cm]=cur.s.split(':'), [lt,li,lm]=L.s.split(':');
    if(ct===lt&&ci===li) return !cm&&lm?'push':'replace';      /* a form opened inside the same sheet */
    return NAV_VIEWER.includes(ct)&&!cm?'push':'replace';        /* a sheet opened from a sheet you were reading */
  }
  return 'replace';
}
/* what back would show right now; sheets use it to decide whether to offer ‹ */
function navUnder(){
  if(!NAV.ready||S.state!=='ready') return null;
  const L=navLoc(), cur=NAV.stack[NAV.i];
  if(navSame(L,cur)) return NAV.stack[NAV.i-1]||null;
  for(let j=NAV.i-1;j>=1;j--) if(navSame(NAV.stack[j],L)) return NAV.stack[j-1]||null;
  return navDecide(cur,L)==='push'?cur:(NAV.stack[NAV.i-1]||null);
}
function navInit(){
  NAV.ready=true;
  try{ history.scrollRestoration='manual'; }catch(e){}
  const st=history.state;
  if(st&&st.slate&&typeof st.i==='number'&&st.i>0){
    /* back from Finance, or a reload: carry on where this entry was */
    NAV.i=st.i;
    if(st.L&&st.L.v&&st.L.v!==S.view){ S.view=st.L.v; _navRender(true); }
    NAV.stack[NAV.i]=navLoc(); NAV.snap[NAV.i]=navSnapNow();
    try{ history.replaceState(navState(NAV.i,NAV.stack[NAV.i]),''); }catch(e){}
    return;
  }
  NAV.i=0; NAV.stack=[navLoc()]; NAV.snap=[navSnapNow()];
  try{ history.replaceState(navState(0,NAV.stack[0],{exit:1}),''); }catch(e){}
}
/* the first entry is the way out. A guard copy sits on it as soon as the person touches the screen,
   so a browser never sees a history step it didn't get a tap for */
function navArm(){
  if(!NAV.ready||NAV.pending||NAV.i!==0||!NAV.stack[0]) return;
  const L={...NAV.stack[0]}; NAV.i=1; NAV.stack.length=1; NAV.stack[1]=L; NAV.snap[1]=NAV.snap[0]?{...NAV.snap[0]}:navSnapNow();
  try{ history.pushState(navState(1,L),''); }catch(e){ NAV.i=0; }
}
function navGo(j){
  NAV.pending=NAV.i-j; clearTimeout(NAV.pendT);
  NAV.pendT=setTimeout(()=>{ if(!NAV.pending) return; NAV.pending=0; const st=history.state; if(st&&st.slate) NAV.i=st.i; navSync(); },900);
  history.go(j-NAV.i);
}
function navSync(){
  if(!NAV.ready||NAV.applying||NAV.pending||S.state!=='ready') return;
  const L=navLoc(), cur=NAV.stack[NAV.i];
  if(navSame(L,cur)){ NAV.snap[NAV.i]=navSnapNow(); return; }
  /* closed by the app's own ‹, ×, Cancel or the Home tab: step history back to that same place */
  for(let j=NAV.i-1;j>=1;j--) if(navSame(NAV.stack[j],L)){
    if(L.v!==cur.v&&NAV.snap[j]) requestAnimationFrame(()=>window.scrollTo(0,NAV.snap[j].y||0));
    return navGo(j);
  }
  if(navDecide(cur,L)==='push'){
    if(NAV.i===0) navArm();
    if(NAV.snap[NAV.i]) NAV.snap[NAV.i].y=window.scrollY;
    NAV.i++; NAV.stack.length=NAV.i; NAV.snap.length=NAV.i;
    NAV.stack[NAV.i]=L; NAV.snap[NAV.i]=navSnapNow();
    try{ history.pushState(navState(NAV.i,L),''); }catch(e){}
  } else {
    NAV.stack[NAV.i]=L; NAV.snap[NAV.i]=navSnapNow();
    try{ history.replaceState(navState(NAV.i,L,NAV.i===0?{exit:1}:null),''); }catch(e){}
  }
}
function navCloseOv(el){
  const done=el.querySelector('.sc-done');
  if(done) done.click(); else el.remove();
}
/* put the screen back to what a history entry describes */
function navApply(L,snap){
  NAV.applying=true;
  let scrollY=null;
  try{
    const ovs=navOvs(); for(let k=ovs.length-1;k>=(L.o||0);k--) navCloseOv(ovs[k]);
    if(navSheetKey(S.sheet)!==(L.s||'')){
      if(L.s&&snap&&snap.sheet&&navSheetKey(snap.sheet)===L.s){ S.sheet={...snap.sheet,err:'',d:snap.sheet.d&&typeof snap.sheet.d==='object'&&!Array.isArray(snap.sheet.d)?{...snap.sheet.d}:snap.sheet.d}; S.sheetAt=0; }
      else S.sheet=null;
      renderSheet();
    }
    if(L.v&&S.view!==L.v){ S.view=L.v; render(true); scrollY=snap?snap.y||0:0; }
  }catch(e){ console.warn('SLATE OS back:',e); }
  NAV.applying=false;
  if(scrollY!==null) requestAnimationFrame(()=>window.scrollTo(0,scrollY));
  /* whatever couldn't be rebuilt (a sheet from before a reload), the entry now says what's really on screen */
  const real=navLoc(); NAV.stack[NAV.i]=real; NAV.snap[NAV.i]=navSnapNow();
  if(!navSame(real,L)) try{ history.replaceState(navState(NAV.i,real,NAV.i===0?{exit:1}:null),''); }catch(e){}
}
window.addEventListener('popstate',e=>{

  const was=navLoc();
  NAV.i=st.i;
  navApply(st.L||navHomeL(),NAV.snap[st.i]);
  if(st.exit){
    /* back on Home: say so once; the next back closes SLATE OS. Any tap re-arms it. */
    if(was.v==='mine'&&!was.s&&!was.o){ NAV.hintAt=Date.now(); try{ toast(navStandalone()?'Go back again to close SLATE OS':'Go back again to leave SLATE OS'); }catch(_){} }
    else navArm();   /* landed on Home from somewhere else: keep Home guarded */
  }
});
['pointerdown','keydown'].forEach(ev=>window.addEventListener(ev,()=>navArm(),{capture:true,passive:true}));
/* popups from Account, Accounts, messages and reports live outside the sheet; history follows them too */
(()=>{ const watch=()=>new MutationObserver(ms=>{ for(const m of ms) for(const n of [...m.addedNodes,...m.removedNodes]) if(n.nodeType===1&&n.matches&&n.matches(NAV_OV)){ navSync(); return; } }).observe(document.body,{childList:true});

const _navRender=render, _navRenderSheet=renderSheet;
render=function(force){ _navRender(force); if(S.state!=='ready') return; if(!NAV.ready) navInit(); navSync(); };

function navBack(label,fn){

    h('span',{text:label}));

/* ‹ in a sheet's head when back would land on another sheet (a task opened from a project, a form inside a task) */
function sheetBack(){

    svgEl('svg',{viewBox:'0 0 24 24',fill:'none',stroke:'currentColor','stroke-width':'2.4','stroke-linecap':'round','stroke-linejoin':'round','aria-hidden':'true'},svgEl('path',{d:'M15 18l-6-6 6-6'})));

/* keeps the sticky ‹ just under the tab bar, whatever height the bar is on this screen */
(()=>{ const set=()=>{ const c=document.querySelector('.chrome'); if(c) document.documentElement.style.setProperty('--chrome-h',c.offsetHeight+'px'); };
