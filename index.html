<!doctype html><html><head><meta charset=utf8><meta name="robots" content="noindex"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SLATE OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one centred 720px column of iOS-style grouped lists on white, matching the SLATE FAR Calculator */
:root{
  --bg:#FFFFFF; --group:#F2F2F7; --fill:#E8E8EC; --ink:#000000; --muted:#8E8E93; --faint:#C7C7CC;
  --line:rgba(60,60,67,.12); --border:#E5E5EA;
  --early:#007AFF; --ontime:#34C759; --late:#FF9500; --overdue:#FF3B30;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --r-lg:16px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:rgba(255,255,255,.92)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.chrome{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top-in{display:flex;align-items:center;justify-content:center;gap:12px;padding-block:14px 6px}
.logo{height:40px;width:auto;display:block}
.divider{width:1px;height:26px;background:var(--border)}
.product{font-size:14px;font-weight:500;color:var(--muted)}
.product{display:inline-flex;flex-direction:column;line-height:1.15}.product b{color:var(--ink);font-weight:600;font-size:15px;letter-spacing:.04em}
.tagline{font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.02em}
@media (max-width:560px){.tagline{display:none}}
.tabs-in{display:flex;justify-content:center;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;font-size:14px;font-weight:500;color:var(--muted);padding:10px 10px 9px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.badge{background:var(--overdue);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;line-height:17px;font-weight:600}

main{padding-block:24px 80px;display:grid;gap:24px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--border)}
.h1{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:0}
.lead{color:var(--muted);margin:6px 0 0;font-size:14px;max-width:60ch}
.eyebrow,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.eyebrow{text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.sec{display:grid;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 4px}
.sec-h h2{font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:0}
.sec-h .cnt{font-size:12px;color:var(--muted)}
.list{display:grid;background:var(--group);border-radius:var(--r);overflow:hidden}
.list>p{padding:14px 16px}

.row{appearance:none;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 16px 12px 12px;display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:4px 16px;align-items:center;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(0,0,0,.03)}
.row-main{min-width:0}
.row-title{font-weight:500;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row-meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 6px;margin-top:2px}
.row-date{text-align:right;min-width:72px}
.row-date .lbl{font-size:11px}
.row-date .mono{font-size:13px}
@media (max-width:560px){
  .row{grid-template-columns:30px minmax(0,1fr) auto}
  .row>.chk{grid-row:1/3;align-self:start;margin-top:1px}
  .row-main{grid-column:2/-1}
  .row-date{text-align:left;display:flex;gap:6px;align-items:baseline;min-width:0}
}

.pill{--c:var(--muted);display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap;background:#fff;color:var(--ink)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.s-early{--c:var(--early)}.s-ontime{--c:var(--ontime)}.s-late{--c:var(--late)}.s-overdue{--c:var(--overdue)}.s-soon{--c:var(--late)}.s-open{--c:var(--faint)}
.pill.s-overdue{color:var(--overdue)}
.tag{font-size:11px;font-weight:600;color:var(--muted);background:var(--fill);padding:1px 7px;border-radius:5px;white-space:nowrap}
.tag-req{background:var(--ink);color:#fff}
.tag-rev{font-family:var(--mono);font-weight:500}

.btn{appearance:none;font-size:14px;font-weight:600;border-radius:var(--r);padding:9px 16px;border:0;background:var(--fill);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--ink);color:#fff}
.btn-accent{background:var(--overdue);color:#fff}
.btn-danger{color:var(--overdue)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.linkish{appearance:none;background:none;border:0;padding:0;color:var(--ink);font-weight:500;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}

input,select,textarea{font-size:15px;background:var(--group);border:0;border-radius:var(--r);padding:10px 12px;width:100%;min-width:0;appearance:none}
select{background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%238E8E93' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:30px;cursor:pointer}
input[type="checkbox"]{appearance:auto;width:18px;height:18px;padding:0;accent-color:#000}
textarea{min-height:68px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:0}
.form input,.form select,.form textarea{background:#fff}
.field{display:grid;gap:6px}
.f-hint{font-size:12.5px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar>select,.bar>input{width:auto;flex:1 1 150px}
.bar .grow{flex:1 1 auto}

.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;flex:none}
.seg button{border:0;background:none;font-size:13px;font-weight:500;padding:6px 12px;color:var(--ink);cursor:pointer;border-radius:7px}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .lab{font-weight:600;text-align:center;padding:0 4px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tile{background:var(--group);border-radius:var(--r-lg);padding:14px 16px;display:grid;gap:6px;align-content:start}
.tile .num{font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.tile .lbl{display:flex;align-items:center;gap:6px}
.tile[data-s] .lbl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.tile.dark{background:var(--ink);color:#fff}
.tile.dark .lbl{color:#999}

.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--fill);min-width:100px;gap:2px}
.stack span{display:block;background:var(--c)}
.stack.lg{height:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}

.tbl-wrap{overflow-x:auto;background:var(--group);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td .sub2{font-size:12.5px;color:var(--muted)}
td input,td select{min-width:130px;background:#fff}

.empty{background:var(--group);border-radius:var(--r-lg);padding:28px 22px;display:grid;gap:12px;justify-items:start}
.empty h3{margin:0;font-size:17px;font-weight:600}
.empty ol{margin:0;padding-left:20px;display:grid;gap:4px;color:var(--muted)}
.banner{background:var(--group);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.state{padding:60px 0;color:var(--muted);display:grid;gap:6px;text-align:center}
.state strong{color:var(--ink);font-weight:600;font-size:18px}

.card{background:var(--group);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.req-dates{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.arrow{color:var(--muted)}
.quote{border-left:2px solid var(--faint);padding-left:10px;margin:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--group);border-radius:999px;padding:5px 6px 5px 12px;font-size:13px}
.chip button{border:0;background:var(--fill);border-radius:50%;width:20px;height:20px;cursor:pointer;color:var(--muted);line-height:1}

#sheet{position:fixed;inset:0;z-index:20}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.3)}
.panel{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;overflow-y:auto;overscroll-behavior:contain;
  padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(36px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  display:grid;gap:16px;align-content:start;box-shadow:-8px 0 30px rgba(0,0,0,.08)}
.sh-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sh-title{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.2;overflow-wrap:anywhere}
.icon-btn{appearance:none;border:0;background:var(--group);border-radius:50%;width:32px;height:32px;font-size:18px;line-height:1;cursor:pointer;flex:none;color:var(--muted)}
.sh-status{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sh-status .pill{background:var(--group)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;background:var(--group);border-radius:var(--r);padding:14px 16px}
.facts .v{font-weight:500;font-size:16px;overflow-wrap:anywhere;margin-top:2px}
.facts .s{font-size:12px;color:var(--muted)}
.callout{background:var(--group);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;box-shadow:inset 3px 0 0 var(--late)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.form{display:grid;gap:12px;background:var(--group);border-radius:var(--r);padding:16px}
.form-title{font-weight:600}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.err{color:var(--overdue);font-size:13.5px;font-weight:500}
.tl{display:grid;border-left:1px solid var(--border);margin-left:4px}
.tl-item{position:relative;padding:0 0 16px 16px;display:grid;gap:2px;font-size:14px}
.tl-item::before{content:"";position:absolute;left:-4px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--faint)}
.tl-item:first-child::before{background:var(--ink)}
.tl-item time{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tl-note{font-size:13.5px;color:var(--muted);border-left:2px solid var(--border);padding-left:8px;margin-top:2px;overflow-wrap:anywhere}
.tl-task{font-size:13px;color:var(--muted)}


/* ---- dashboard widgets (ClickUp-style grid) ---- */
main.wide{max-width:1160px}
.widgets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.w{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px 16px;display:grid;gap:12px;align-content:start;min-width:0}
.w.span2{grid-column:span 2}
@media (max-width:760px){.w.span2{grid-column:auto}}
.w-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.w-t{font-size:14px;font-weight:600}
.w-s{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:grid;gap:4px}
.kpi .num{font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .lbl{display:flex;align-items:center;gap:6px}
.kpi[data-s] .lbl::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.kpi.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.kpi.dark .lbl{color:#9a9aa0}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:none}
.leg{display:grid;gap:6px;font-size:13px;flex:1;min-width:150px}
.leg div{display:flex;align-items:center;gap:8px}
.leg i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.leg b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.hb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.track{position:relative;height:12px;background:var(--group);border-radius:4px;display:flex;gap:2px;overflow:hidden}
.track span{display:block;height:100%;background:var(--c)}
.track span:first-child{border-radius:4px 0 0 4px}.track span:last-child{border-radius:0 4px 4px 0}
.track span:only-child{border-radius:4px}
.goal{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.cols{display:grid;grid-template-columns:28px 1fr;gap:6px}
.cols .yax{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--muted);text-align:right;height:150px;font-variant-numeric:tabular-nums}
.cols .plot{position:relative;height:150px;display:flex;align-items:flex-end;gap:10px;border-bottom:1px solid var(--border);background:linear-gradient(var(--border),var(--border)) 0 0/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat}
.cols .col{flex:1;display:flex;flex-direction:column-reverse;gap:2px;height:100%;justify-content:flex-start;min-width:0;cursor:default}
.cols .col span{display:block;background:var(--c);width:min(36px,100%);margin:0 auto}
.cols .col span:last-child{border-radius:4px 4px 0 0}
.cols .xax{grid-column:2;display:flex;gap:10px;font-size:11px;color:var(--muted)}
.cols .xax span{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl{display:grid}
.wl button{appearance:none;background:none;border:0;border-top:1px solid var(--line);padding:9px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;cursor:pointer;font-size:14px}
.wl button:first-child{border-top:0}
.wl .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl .m{font-size:12px;color:var(--muted);grid-column:1}
.wl .d{grid-row:1/3;grid-column:2;align-self:center;font-size:12.5px;font-weight:600;font-family:var(--mono)}
.w-empty{font-size:13px;color:var(--muted);padding:8px 0}
/* ---- board (kanban) ---- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start}
.kcol{background:var(--group);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;min-height:160px;transition:box-shadow .12s}
.kcol.over{box-shadow:inset 0 0 0 2px var(--ink)}
.kcol-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kcol-h .dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block;margin-right:7px}
.kcard{background:#fff;border-radius:10px;padding:10px 12px;display:grid;gap:6px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid var(--border);text-align:left}
.kcard[draggable="true"]{cursor:grab}
.kcard.dragging{opacity:.4}
.kcard .kt{font-weight:500;font-size:14px;overflow-wrap:anywhere}
.kcard .km{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 6px}
.kcard .kf{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.kcard .pill{background:var(--group);font-size:12px;padding:2px 8px}
.kempty{font-size:13px;color:var(--faint);text-align:center;padding:14px 0}
/* ---- timeline (gantt) ---- */
.gantt{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:#fff;--lab:240px}
@media (max-width:560px){.gantt{--lab:150px}}
.g-in{position:relative;min-width:max-content}
.g-row{display:grid;grid-template-columns:var(--lab) auto;border-bottom:1px solid var(--line)}
.g-row:last-child{border-bottom:0}
.g-lab{position:sticky;left:0;z-index:2;background:#fff;padding:6px 12px;border-right:1px solid var(--border);min-width:0;display:grid;align-content:center}
.g-lab .t{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.g-lab .m{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-row.proj .g-lab,.g-row.proj .g-trk{background:var(--group)}
.g-row.proj .g-lab .t{font-weight:600}
.g-trk{position:relative;height:36px}
.g-row.proj .g-trk{height:32px}
.g-head .g-lab{font-size:12px;color:var(--muted);font-weight:600}
.g-head .g-trk{height:44px}
.g-mon{position:absolute;top:4px;font-size:12px;font-weight:600;white-space:nowrap;padding-left:4px;border-left:1px solid var(--border)}
.g-tick{position:absolute;bottom:4px;font-size:11px;color:var(--muted);white-space:nowrap;transform:translateX(-50%)}
.g-bar{position:absolute;top:10px;height:16px;border-radius:5px;display:flex;overflow:hidden;cursor:pointer;min-width:4px}
.g-bar span{display:block;height:100%}
.g-bar .base{background:var(--c)}
.g-bar.open .base{opacity:.45}
.g-bar .ext{background:var(--c)}
.g-span{position:absolute;top:13px;height:6px;border-radius:3px;background:var(--faint)}
.g-ms{position:absolute;top:11px;width:13px;height:13px;transform:translateX(-50%) rotate(45deg);background:var(--c);border:2px solid #fff;box-shadow:0 0 0 1px var(--c);cursor:pointer}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--overdue);z-index:1;pointer-events:none}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}

.pc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}

.pc-name{font-weight:600;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.pc-meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.pc-bar{height:8px;background:var(--group);border-radius:4px;overflow:hidden}

.pc-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;min-width:0}

.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.tcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:grid;gap:10px;align-content:start;min-width:0}
.tc-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tc-t{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.tc-s{font-size:12.5px;color:var(--muted)}
.prow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.ava{width:34px;height:34px;border-radius:50%;background:var(--group);display:grid;place-items:center;font-size:13px;font-weight:600;color:#3a3a3c}
.ava.lead{background:var(--ink);color:#fff}
.prow .nm{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .rl{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .ld{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.mini{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--group);white-space:nowrap;font-variant-numeric:tabular-nums}

.tc-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tc-stats div{background:var(--group);border-radius:8px;padding:7px 8px;display:grid;gap:1px}
.tc-stats b{font-size:17px;font-variant-numeric:tabular-nums}
.tc-stats span{font-size:11px;color:var(--muted);font-weight:600}
.sub-h{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:6;margin-top:4px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden;display:grid;max-height:300px;overflow-y:auto}
.sg{appearance:none;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;padding:10px 12px;display:grid;gap:2px;cursor:pointer;font:inherit;font-size:14px;color:var(--ink)}
.sg:last-child{border-bottom:0}.sg:hover,.sg:focus{background:var(--group)}
.sg-c{font-size:12px;color:var(--muted)}
/* ---- easy mode ---- */
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--faint);background:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;cursor:pointer;padding:0;align-self:center;flex:none}
.chk:hover{border-color:var(--ontime);background:#EAF8EE}
.chk.on{background:var(--ontime);border-color:var(--ontime);cursor:default}
.chk.off{border-style:dashed;cursor:default;background:transparent}
.row:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.toast-act{appearance:none;border:0;background:none;color:#7CC4FF;font:inherit;font-weight:700;margin-left:14px;padding:0;cursor:pointer}
#toast{display:flex;align-items:center}#toast[hidden]{display:none}
#fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:30px;line-height:1;cursor:pointer;z-index:15;box-shadow:0 6px 18px rgba(0,0,0,.25)}

.chip.qd{border:0;cursor:pointer;padding:6px 12px;display:grid;gap:0;text-align:left;border-radius:10px;background:#fff}

.chip.on{background:var(--ink)!important;color:#fff}.chip.on span{color:#ccc}
.more-i{appearance:none;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;font:inherit;color:inherit;width:100%}

.mi-t{font-weight:600}.mi-d{font-size:13px;color:var(--muted)}.mi-a{font-size:22px;color:var(--faint)}
main{padding-bottom:110px}
/* ---- JV unit chart ---- */

.ugrid{display:grid;gap:4px;overflow-x:auto}
.uc,.uh,.uf{appearance:none;font:inherit;border-radius:6px;min-height:34px;display:grid;place-items:center;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.uc{border:1px solid var(--border);background:#fff;color:var(--ink);cursor:pointer}
span.uc{cursor:default}
.uc.lo{background:var(--ink);border-color:var(--ink);color:#fff}
.uh{border:0;background:transparent;color:var(--muted);cursor:pointer;min-height:24px}
.uf{border:0;background:var(--group);color:#3a3a3c;cursor:pointer;font-size:11.5px}

/* ---- profile icons ---- */
.ava.ic{background:var(--c);color:#fff}
.ava svg{width:62%;height:62%}
.ava-sm{width:18px;height:18px;font-size:8.5px;flex:none}
.ava-md{width:44px;height:44px;font-size:15px}
.ava-lg{width:64px;height:64px;font-size:22px}
span.ava{display:inline-grid;place-items:center;border-radius:50%;vertical-align:middle}
.who{display:inline-flex;align-items:center;gap:5px}
.mebtn{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-35%);appearance:none;border:0;background:none;padding:0;cursor:pointer}
.mebtn .ava{width:38px;height:38px}
.me-plus{position:absolute;right:-3px;bottom:-2px;width:16px;height:16px;border-radius:50%;background:var(--early);color:#fff;font-size:12px;font-weight:700;line-height:16px;text-align:center;border:2px solid #fff;box-sizing:content-box}
.icgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.icopt{appearance:none;border:2px solid transparent;background:var(--group);border-radius:12px;padding:10px 4px 8px;display:grid;justify-items:center;gap:6px;cursor:pointer;font:inherit}

.icn{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icopt.on .icn{color:var(--ink);font-weight:600}
/* ---- client revisions ---- */
.rev-item{border-bottom:1px solid var(--line)}.rev-item:last-child{border-bottom:0}
.rev-item .row{border-bottom:0}
.rev-fb{font-size:12.5px;color:var(--muted);padding:0 16px 12px 54px;margin-top:-4px;overflow-wrap:anywhere}
/* ---- meetings ---- */
.mt-card{gap:8px}
.mt-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.mt-row:last-child{border-bottom:0}.mt-row:hover{background:rgba(0,0,0,.03)}
.mt-row .mi-a{font-size:22px;color:var(--faint)}
.mt-wk span.ava:not(.ic):not(.lead),.who span.ava:not(.ic):not(.lead),.chip span.ava:not(.ic):not(.lead),.row-meta span.ava:not(.ic):not(.lead),.kf span.ava:not(.ic):not(.lead){background:#fff;color:#3a3a3c;box-shadow:inset 0 0 0 1px var(--border)}
.chip.on span.ava:not(.ic){background:#444;color:#fff;box-shadow:none}
.mt-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.mt-wk{background:var(--group);border-radius:10px;padding:8px 4px;display:grid;justify-items:center;gap:4px;text-align:center}
.mt-wk.me{background:#fff;box-shadow:inset 0 0 0 2px var(--ink)}
.mt-g{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mt-g.me{color:var(--early);font-weight:600}
.mt-nm{font-size:12px;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---- notifications ---- */
.top-in{position:relative}
.bell{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-35%);appearance:none;border:0;background:var(--group);width:38px;height:38px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.bell svg{width:19px;height:19px}
.bell .badge{position:absolute;top:-3px;right:-4px;min-width:18px;text-align:center;border:2px solid #fff}
.n-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.n-sum div{background:var(--group);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.n-sum b{font-size:20px;font-variant-numeric:tabular-nums}
.n-sum span{font-size:11.5px;color:var(--muted);font-weight:600}
.n-day{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:6px 4px 0}
.panel{grid-auto-rows:max-content}
.n-list{display:grid;background:var(--group);border-radius:var(--r);overflow:hidden}
.n-item{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:4px 10px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
.n-item:last-child{border-bottom:0}
.n-item .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:transparent}
.n-item.unread .dot{background:var(--c)}
.n-item .nt{font-weight:500;font-size:14px;cursor:pointer;text-align:left;background:none;border:0;padding:0;overflow-wrap:anywhere}
.n-item:not(.unread) .nt{color:#3a3a3c;font-weight:400}
.n-item .nb{grid-column:2;font-size:13px;color:var(--muted);white-space:pre-line;overflow-wrap:anywhere}
.n-item .nm{grid-column:2;font-size:11.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.n-item .na{grid-row:1/4;grid-column:3;appearance:none;border:0;background:#fff;border-radius:8px;font-size:12px;font-weight:600;padding:6px 9px;cursor:pointer;color:var(--muted);align-self:start}
.n-cat{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c)}
.c-action{--c:var(--overdue)}.c-deadline{--c:var(--late)}.c-update{--c:var(--early)}.c-weekly{--c:var(--ink)}
.n-snd{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);cursor:pointer;padding:0 4px}
/* notifications as a tab beside the main tabs (replaces the corner bell) */
#bell-slot{display:none}
.tab-notif{position:relative;margin-left:9px}
.tab-notif::before{content:"";position:absolute;left:-6px;top:50%;width:1px;height:16px;background:var(--border);transform:translateY(-50%)}
.tab-notif svg{width:15px;height:15px;flex:none}
/* ---- phone layout ---- */
.kmove{display:none}
.w{grid-template-columns:minmax(0,1fr)}.w>*{min-width:0}
.w-h{flex-wrap:wrap}

}

.ce.done .ce-t{text-decoration:line-through;color:var(--muted)}
.ce.prop{background:transparent;outline:1px dashed var(--faint);outline-offset:-1px}
.ce-t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ce-more{font-size:11px;color:var(--muted);padding-left:6px}
.cal-dots{display:none}
.cal-row{appearance:none;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left;font:inherit;color:inherit;padding:10px 16px 10px 12px;display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;cursor:pointer;box-shadow:none!important;border-radius:0;font-size:15px}
.cal-row:last-child{border-bottom:0}
.cal-row:hover{background:rgba(0,0,0,.03)}
.cr-bar{align-self:stretch;border-radius:2px;background:var(--c,var(--kc))}
.cal-row.ce-meet .cr-bar,.cal-row.ce-fb .cr-bar{background:var(--kc)}
.cr-t{font-weight:500;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.cal-row.done .cr-t>span:first-child{text-decoration:line-through;color:var(--muted)}
.cr-m{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 5px;margin-top:2px}
@media (max-width:700px){
  .cal-c{min-height:52px;padding:4px 2px;align-items:center}
  .cal-n{justify-content:center;font-size:14px}
  .cal-items{display:none}
  .cal-dots{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
  .cal-dots i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--kc))}
  .cal-dots i.ce-meet,.cal-dots i.ce-fb{background:var(--kc)}
  .cal-c.sel{box-shadow:none}.cal-c.sel .cal-n span{background:var(--ink);color:#fff}
  .cal-c.today.sel .cal-n span{background:var(--overdue)}
  .cal-row{grid-template-columns:4px minmax(0,1fr)}
  .cal-row .pill{grid-column:2;justify-self:start}
}
</style>

function tgt(t,basis){ return basis==='original'?(t.originalTarget||t.target):t.target; }
function status(t,basis='approved'){

  if(t.doneAt){ if(t.doneAt<g) return 'early'; if(t.doneAt===g) return 'ontime'; return 'late'; }

  else if(s==='late') txt=`Done ${diff(g,t.doneAt)}d late`;
  else if(s==='overdue') txt=`Overdue ${diff(g,today())}d`;

const PREF_KEY='slate-tr';

/* notification sound: a soft two-note chime when a new notification arrives while SLATE OS is open.
   On by default; each person can switch it off for their own browser in the notifications panel. */
let _nAC=null, _nLast=null, _nStart=0;
const soundOn=()=>pref.nSound!==false;
function nAudio(){ try{ if(!_nAC){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; _nAC=new AC(); } if(_nAC.state==='suspended') _nAC.resume(); return _nAC; }catch(e){ return null; } }
['pointerdown','keydown','touchstart'].forEach(ev=>window.addEventListener(ev,()=>{ if(soundOn()) nAudio(); },{capture:true,passive:true}));
function chime(){ const ac=nAudio(); if(!ac) return; const t=ac.currentTime+.02;
  [[880,0],[1318.5,.13]].forEach(([f,d])=>{ const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(.16,t+d+.015); g.gain.exponentialRampToValueAtTime(.0001,t+d+.7);
    o.connect(g); g.connect(ac.destination); o.start(t+d); o.stop(t+d+.75); }); }
function nSoundCheck(nn){ if(!S.nst) return; if(!_nStart) _nStart=Date.now();
  if(Date.now()-_nStart<5000){ _nLast=nn; return; }   // ignore the burst while data first loads
  if(_nLast!==null&&nn>_nLast&&soundOn()) chime(); _nLast=nn; }
/* interface sounds: short, quiet cues for taps and clicks. Separate switch from the notification chime. */

function tone(f1,f2,dur,vol,type,delay){ const ac=nAudio(); if(!ac) return; const t=ac.currentTime+.01+(delay||0), o=ac.createOscillator(), g=ac.createGain();

  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.005); g.gain.exponentialRampToValueAtTime(.0001,t+dur);

const SFX={
  tap:    ()=>tone(1500,1300,.035,.035,'triangle'),                         // any ordinary button or row
  tab:    ()=>tone(700,640,.06,.05,'sine'),                                 // switching tabs
  toggle: ()=>tone(1100,1100,.03,.04,'square'),                             // switches, checkboxes, segmented controls
  open:   ()=>tone(520,820,.09,.05,'sine'),                                 // opening a panel or the + button
  close:  ()=>tone(760,480,.08,.045,'sine'),                                // closing a panel
  confirm:()=>{ tone(740,740,.07,.05,'sine'); tone(988,988,.1,.05,'sine',.06); },     // save, submit, approve
  remove: ()=>tone(330,220,.12,.05,'triangle'),                             // delete, decline, archive

let _sfxAt=0;
document.addEventListener('click',e=>{
  const el=e.target.closest&&e.target.closest('button,a,select,label,input,[role="button"],.row,.more-i,.backdrop'); if(!el||el.disabled) return;
  const now=Date.now(); if(now-_sfxAt<40) return; _sfxAt=now;
  const lbl=((el.getAttribute('aria-label')||'')+' '+(el.textContent||'')).trim().toLowerCase();
  let k='tap';
  if(el.matches('.chk:not(.on)')) return;                                   // the done chime follows once it saves
  if(el.matches('.tab')) k=el.matches('.tab-notif')?'open':'tab';
  else if(el.matches('#fab')) k='open';
  else if(el.matches('.backdrop')||el.matches('.icon-btn')&&/close|×/.test(lbl)) k='close';
  else if(el.matches('input[type="checkbox"],input[type="radio"],label,.seg button,.chip,select')) k='toggle';
  else if(el.matches('.btn-danger,.na')||/^(delete|remove|decline|return|archive)/.test(lbl)) k='remove';

  else if(el.matches('.row,.more-i,.nt,.mebtn,.bell')) k='open';

const RG={lead:'Pod Lead',junior:'Junior Architect',dhead:'Drafting Head',draft:'Drafting Associate',viz:'Visualizer',intern:'Intern',other:'Other',boss:''};

   Built from what is already recorded (task history, dates, requests), so nothing extra is stored per event.

const histText=e=>{
  const by=nameOf(e.by), pn=id=>S.projects[id]?S.projects[id].name:'another project';
  switch(e.type){
    case 'assignRequested': return `${by} requested ${nameOf(e.to)}${e.cross?' from '+podLabel(e.cross):''} for this task`;
    case 'assignApproved': return e.to===e.from?`${by} approved assigning it to ${nameOf(e.to)}`:`${by} assigned it to ${nameOf(e.to)} instead of ${nameOf(e.from)}`;
    case 'assignDeclined': return `${by} declined assigning it to ${nameOf(e.to)}`;
    case 'created': if(!e.assignee) return e.to?`${by} created this with a target of ${fmtD(e.to)}`:`${by} created this`; return e.to?`${by} assigned this to ${nameOf(e.assignee)} with a target of ${fmtD(e.to)}`:`${by} assigned this to ${nameOf(e.assignee)}`;
    case 'proposed': return `${by} proposed ${fmtD(e.to)} as the target date`;
    case 'scheduled': return `${by} set the target date to ${fmtD(e.to)}`;
    case 'reassigned': return `${by} reassigned it from ${nameOf(e.from)} to ${nameOf(e.to)}`;
    case 'target': return `${by} changed the target from ${fmtD(e.from)} to ${fmtD(e.to)} (now R${e.rev})`;
    case 'request': return `${by} requested a new date: ${fmtD(e.to)} (current target ${fmtD(e.from)})`;
    case 'approved': return e.from?`${by} approved the new date ${fmtD(e.to)}, previously ${fmtD(e.from)} (now R${e.rev})`:`${by} approved the target date ${fmtD(e.to)}`;
    case 'declined': return `${by} returned the proposed date ${fmtD(e.to)}`;
    case 'done': return `${by} marked it done, completed ${fmtD(e.to)}`;
    case 'revisionAdded': return `${by} logged client revision ${e.n} (feedback received ${fmtD(e.to)})`;
    case 'doneChanged': return `${by} corrected the completion date from ${fmtD(e.from)} to ${fmtD(e.to)}`;
    case 'reopened': return `${by} reopened it (was completed ${fmtD(e.from)})`;
    case 'renamed': return `${by} renamed it from “${e.from}” to “${e.to}”`;
    case 'kind': return `${by} changed the type from ${e.from} to ${e.to}`;
    case 'repeat': return e.to?`${by} set it to repeat ${e.to}`:`${by} stopped it repeating`;
    case 'moved': return `${by} moved it from ${pn(e.from)} to ${pn(e.to)}`;
    case 'archived': return `${by} archived it`;
    case 'category': return `${by} changed the category from ${e.from||'none'} to ${e.to||'none'}`;
    case 'stage': return `${by} moved it from ${STAGE_L[e.from]||e.from} to ${STAGE_L[e.to]||e.to}`;
    case 'start': return e.to?`${by} set the start date to ${fmtD(e.to)}`:`${by} cleared the start date`;

    default: return `${by} updated it`;

};

    if(dels.length) out.push(h('section',{class:'sec'},h('div',{class:'sec-h'},h('h2',{text:'Milestones'}),h('span',{class:'cnt',text:`${dels.filter(t=>t.doneAt).length}/${dels.length}`})),h('div',{class:'list'},dels.map(t=>row(t,{project:false}))))); }

      p.docUrl?h('div',{style:'grid-column:1/-1'},h('a',{href:p.docUrl,target:'_blank',rel:'noopener',text:'Open agreement document ↗'})):null)));
  if(p.note&&(ap||det)) out.push(h('p',{class:'quote',text:p.note}));
  const acts=[];
  if(det&&S.canWrite) acts.push(h('button',{class:'btn btn-primary',type:'button',onclick:()=>{ S.f.project=p.id; S.f.status='active'; S.view='all'; closeSheet(); render(true); window.scrollTo(0,0); },text:'Open tasks'}));

  if(acts.length) out.push(h('div',{class:'actions'},acts));
  return out;
}

(function(){ const tip=document.getElementById('tip'); if(!tip) return;
  const show=(e)=>{ const el=e.target.closest&&e.target.closest('[data-tip]'); if(!el){tip.hidden=true;return;} tip.textContent=el.getAttribute('data-tip'); tip.hidden=false;
    const x=Math.min(e.clientX+12,window.innerWidth-tip.offsetWidth-8), y=Math.max(8,e.clientY-tip.offsetHeight-10); tip.style.left=x+'px'; tip.style.top=y+'px'; };
  document.addEventListener('mousemove',show); document.addEventListener('mouseleave',()=>{tip.hidden=true});
  document.addEventListener('touchstart',e=>{ const t=e.touches[0]; show({target:e.target,clientX:t.clientX,clientY:t.clientY}); setTimeout(()=>{tip.hidden=true},2200); },{passive:true});
})();
